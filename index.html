<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reiselogbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Reiselogbuch</title>
<style>
  /* Farben im Apple-Look: Hintergrund Hellgrau, Kästen weiß ohne Rand, schwebende Schaltflächen */
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --ink: #1c1c1e;
    --muted: #8a8a8e;
    --line: #d1d1d6;
    --accent: #007aff;
    --accent-ink: #ffffff;
    --sw-on: #34c759;
    --sw-off: #e9e9eb;
    --danger: #b3261e;
    --danger-fill: #d70015;
    --warn: #c07a12;
    --focus: #fff1c2;
    --row-hover: #ececf1;
    --th-bg: #e5e5ea;
    --th-line: #c7c7cc;
    --zebra: #f7f7f9;
    --field-line: #c7c7cc;
    --dlg-bg: #f2f2f7;
    --dlg-card: #ffffff;
    --dlg-field: #ffffff;
    --btn: #f9f9f9;
    --btn-rim: #ffffff;
    --sel-bg: #dcebff;
    --mark: #ffe45c;
    --mark-cur: #ffc46b;
    --mark-cur-ink: inherit;
    --float: 0 3px 28px rgba(0,0,0,.16);
    --glow-accent: 0 2px 4px rgba(0,0,0,.10), 0 5px 18px rgba(0,122,255,.50);
    --table-shadow: 0 1px 3px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.12);
    --glow-danger: 0 2px 4px rgba(0,0,0,.12), 0 5px 14px rgba(215,0,21,.35);
    --rim-color: rgba(255,255,255,.5);
    --bar-h: 64px;
    --side-w: 0px;
    --vv-top: 0px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #1c1c1e; --ink: #ffffff; --muted: #8e8e93; --line: #38383a;
    --accent: #0a84ff; --accent-ink: #ffffff; --sw-on: #30d158; --sw-off: #39393d; --danger: #ff6961; --danger-fill: #ff453a; --warn: #e2a64b;
    --focus: #45391a; --row-hover: #2c2c2e;
    --th-bg: #2c2c2e; --th-line: #48484a; --zebra: #161618; --field-line: #48484a;
    --dlg-bg: #1c1c1e; --dlg-card: #2c2c2e; --dlg-field: #1c1c1e;
    --btn: #3a3a3c; --btn-rim: rgba(255,255,255,.16); --sel-bg: #10335c;
    --mark: #8a6d00; --mark-cur: #e08a1e; --mark-cur-ink: #000;
    --float: 0 3px 28px rgba(0,0,0,.7);
    --glow-accent: 0 2px 4px rgba(0,0,0,.5), 0 5px 18px rgba(10,132,255,.50);
    --table-shadow: 0 0 0 .5px rgba(255,255,255,.12), 0 1px 3px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.6);
    --glow-danger: 0 2px 4px rgba(0,0,0,.5), 0 5px 16px rgba(255,69,58,.35);
    --rim-color: rgba(255,255,255,.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 0 max(16px, env(safe-area-inset-right)) 100px max(16px, env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 28px; margin: 12px 0 6px; }
  h2 { font-size: 20px; margin: 28px 0 8px; }
  a { color: var(--accent); }
  button, input, textarea { font: inherit; color: inherit; }
  /* Schwebende Schaltfläche: fast weiße Fläche, weiße Lichtkante (Haarlinie), weicher Schatten, Kapselform */
  button {
    border: .5px solid var(--btn-rim); background: var(--btn); border-radius: 22px; box-shadow: var(--float);
    padding: 8px 14px; cursor: pointer; min-height: 44px; line-height: 20px;
  }
  button:disabled, button[aria-disabled="true"] { opacity: .4; cursor: default; }
  button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ic.red { color: var(--danger); }
  button.primary .ic.red { color: inherit; }
  /* Komponente Suchfeld: schwebende Kapsel mit Lupe, Trefferanzeige "3 von 57" und x; daneben Treffer-Navigation */
  .searchbox { position: relative; display: inline-flex; align-items: center; flex: 0 1 200px; }
  .searchbox.active { flex-basis: 300px; }
  .searchbox > .ic { position: absolute; left: 12px; color: var(--muted); pointer-events: none; }
  .searchbox input[type=search] { width: 100%; height: 44px; border-radius: 22px; padding: 0 14px 0 38px;
    background: var(--btn); border: .5px solid var(--btn-rim); box-shadow: var(--float); -webkit-appearance: none; appearance: none; }
  .searchbox input[type=search]::-webkit-search-cancel-button { display: none; }
  .searchbox .smeta { position: absolute; right: 6px; display: flex; align-items: center; gap: 4px; }
  .searchbox .scount { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; }
  .searchbox .sclear { width: 32px; height: 32px; min-height: 0; min-width: 0; padding: 0; border: none; box-shadow: none; background: none; color: #a1a1a6; border-radius: 50%; }
  .searchbox .sclear svg { width: 20px; height: 20px; }
  /* Komponente Kapsel: mehrere Schaltflächen in einer schwebenden Kapsel */
  .grp, .navgrp { display: inline-flex; flex: none; height: 44px; border-radius: 22px; background: var(--btn); border: .5px solid var(--btn-rim); box-shadow: var(--float); }
  .grp button, .navgrp button { background: none; border: none; box-shadow: none; width: 48px; min-width: 48px; padding: 0; border-radius: 22px; }
  .grp button.txt { width: auto; padding: 0 14px; }
  .grp button.fill { background: var(--accent); color: var(--accent-ink); }
  .grp button:disabled, .navgrp button:disabled { opacity: .3; }
  /* Gedrückt: Die Schaltfläche, von der ein offenes Menü, eine Sprechblase oder ein Fenster kommt, ist blau hinterlegt. */
  button.on { background: var(--sel-bg); border-color: var(--accent); }
  .grp button.on, .navgrp button.on { background: var(--sel-bg); box-shadow: inset 0 0 0 .5px var(--accent); }
  .round { width: 44px; min-width: 44px; height: 44px; padding: 0; border-radius: 50%; flex: none; }
  /* Grün gefüllt = Hauptaktion; grün getönt mit Rand = eingeschaltet; rot gefüllt = Löschen (jeweils mit farbigem Schein) */
  button.primary { background: var(--accent); color: var(--accent-ink); border: .5px solid var(--rim-color); box-shadow: var(--glow-accent); }
  button.link { border: none; background: none; box-shadow: none; color: var(--accent); padding: 6px 8px; }
  button.danger { background: var(--danger-fill); color: #fff; border: .5px solid var(--rim-color); box-shadow: var(--glow-danger); }
  button.danger .ic.red { color: inherit; }
  button[aria-pressed="true"] { background: var(--sel-bg); border: .5px solid var(--accent); color: var(--ink); box-shadow: var(--glow-accent); }
  input[type=text], input[type=search], input[type=date], input[type=number], textarea {
    width: 100%; border: .5px solid var(--btn-rim); border-radius: 10px; background: var(--card); box-shadow: var(--float);
    padding: 10px 12px; min-height: 44px;
  }
  input:disabled { opacity: .6; }
  input.invalid { border: 1px solid var(--danger); }
  .step.off .hint { opacity: .5; }
  /* Textfelder wachsen mit dem Inhalt; man muss nie innerhalb eines Feldes scrollen. */
  textarea { resize: none; overflow: hidden; min-height: 96px; }
  /* Datumsfelder sind so breit wie das Datum (wird beim Öffnen berechnet). */
  input[type=date] { -webkit-appearance: none; appearance: none; text-align: left; }
  input[type=date]::-webkit-date-and-time-value { text-align: left; }
  dialog input[type=date] { flex: none; }
  .dates { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dates .dl { color: var(--muted); }
  .dates .dl + .datebox + .dl { margin-left: 14px; }
  .datebox { position: relative; display: inline-flex; align-items: center; flex: none; }
  .datebox input[type=date] { padding-right: 40px; }
  .datebox > .ic { position: absolute; right: 12px; pointer-events: none; }
  .datebox input::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: auto; height: auto; opacity: 0; cursor: pointer; }
  label { display: block; font-weight: 600; margin: 0 0 6px; }
  .muted { color: var(--muted); }
  .spacer { flex: 1; }

  /* Komponente Kopfzeile: fest oben, Titel in der Mitte, rechts eine Kapsel; die Suche erscheint als zweite Zeile */
  .nb { position: sticky; top: var(--vv-top); z-index: 6; background: var(--bg); margin: 0 -16px; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom: .5px solid transparent; }
  .nb.line { border-bottom-color: var(--line); }
  .nb1 { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; min-height: 44px; }
  .nb1 > .r { justify-self: end; }
  .nb-title { font-weight: 600; font-size: 17px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nb2 { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
  .nb2 .searchbox { flex: 1 1 auto; }
  .emptymain { margin-top: 120px; text-align: center; color: var(--muted); font-size: 19px; }

  /* Komponente Seitenleiste: quer fest links neben dem Inhalt, im Hochformat über den Inhalt gelegt */
  /* Schwebend wie in Safari: runde Ecken, Lichtkante und Schatten wie die Schaltflächen, Abstand zum Rand */
  body.docked { padding-left: calc(var(--side-w) + max(10px, env(safe-area-inset-left)) + 20px); }
  #side { position: fixed; z-index: 7; top: calc(env(safe-area-inset-top) + 10px); bottom: calc(env(safe-area-inset-bottom) + 4px); left: max(10px, env(safe-area-inset-left));
    width: max-content; min-width: 340px; max-width: 420px; overflow-y: auto;
    background: var(--card); border: .5px solid var(--btn-rim); border-radius: 22px; box-shadow: var(--float);
    display: flex; flex-direction: column; padding: 10px 12px 14px; }
  #side[hidden] { display: none; }
  #side.over { z-index: 25; }
  .side-shade { position: fixed; inset: 0; z-index: 24; background: rgba(0,0,0,.25); }
  .side-head { display: flex; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 14px; padding-left: 8px; }
  .side-head h2 { margin: 0 4px 0 0; flex: 1; font-size: 20px; white-space: nowrap; }
  #side .side-row { display: block; width: 100%; text-align: left; border: none; box-shadow: none; background: none; border-radius: 12px; padding: 9px 12px; margin-bottom: 4px; min-height: 0; }
  .side-row b { display: block; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
  .side-row small { display: block; color: var(--muted); font-size: 14px; white-space: nowrap; }
  #side .side-row.current { background: var(--accent); color: var(--accent-ink); box-shadow: var(--glow-accent); }
  .side-row.current small { color: rgba(255,255,255,.85); }
  .side-empty { color: var(--muted); padding: 8px 12px; }
  .bhint { margin-top: auto; padding: 16px 12px 0; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .bhint button { color: var(--ink); font-size: 17px; }

  /* Komponente Menü: Karte mit Schatten wie die Schaltflächen, Icons vor dem Text; antippen daneben schließt */
  .layer { position: fixed; inset: 0; z-index: 29; }
  .menu { position: fixed; z-index: 30; width: 340px; background: var(--card); border-radius: 14px; border: .5px solid var(--btn-rim); box-shadow: var(--float); overflow: hidden; }
  .menu .mi { display: flex; justify-content: flex-start; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 0 16px; font-size: 17px; text-align: left;
    border: none; border-bottom: .5px solid var(--line); border-radius: 0; background: none; box-shadow: none; }
  .menu .mi:last-child, .menu .mi.has-sub { border-bottom: none; }
  .menu .mi.red { color: var(--danger); }
  .menu .tick { width: 20px; display: inline-flex; color: var(--accent); }
  .menu .sub { font-size: 13px; color: var(--muted); padding: 0 16px 10px 46px; margin-top: -8px; border-bottom: .5px solid var(--line); }
  .menu .sep { height: 8px; background: var(--bg); }
  .menu .note { font-size: 13px; color: var(--muted); padding: 10px 16px; }
  /* Komponente Sprechblase (Abfrage): an der angetippten Schaltfläche; roter Knopf, darunter der Weg zurück */
  .pop { position: fixed; z-index: 30; width: 320px; background: var(--card); border-radius: 14px; border: .5px solid var(--btn-rim); box-shadow: var(--float); padding: 16px; text-align: center; }
  .pop p { margin: 0 0 14px; font-size: 15px; color: var(--muted); }
  .pop .btns { display: flex; flex-direction: column; gap: 10px; }
  .pop .btns button { width: 100%; }
  :root[data-theme="dark"] .menu, :root[data-theme="dark"] .pop { background: #2c2c2e; }
  :root[data-theme="dark"] .menu .sep { background: #1c1c1e; }


  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 4px 0 6px; }
  .meta dt { font-weight: 600; }
  .meta dd { margin: 0; }
  .progress { font-size: 14px; color: var(--muted); margin: 0 0 12px; }

  /* Tabelle */
  .table-wrap { background: var(--card); border-radius: 12px; overflow: clip; box-shadow: var(--table-shadow); }
  table.days { border-collapse: separate; border-spacing: 0; width: 100%; }
  table.days th, table.days td { border-bottom: 1px solid var(--line); padding: 10px 12px; vertical-align: top; text-align: left; }
  table.days td + td { border-left: 1px solid var(--line); }
  table.days th { position: sticky; top: calc(var(--bar-h) + var(--vv-top)); background: var(--th-bg); border-bottom-color: var(--th-line); font-size: 17px; font-weight: 600; z-index: 2; }
  table.days th + th { border-left: 1px solid var(--th-line); }
  table.days tbody tr:last-child td { border-bottom: none; }
  table.days tbody tr { cursor: pointer; }
  table.days tbody tr.alt { background: var(--zebra); }
  @media (hover: hover) { table.days tbody tr:hover { background: var(--row-hover); } }
  table.days tbody tr.gap { background: var(--focus); box-shadow: inset 4px 0 0 var(--accent); }
  td.day { white-space: nowrap; width: 1%; }
  td.day .wx { display: block; font-size: 18px; }
  td.day .wx.empty { opacity: .25; }
  .tag { display: inline-block; font-size: 12px; border-radius: 6px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
  .tag.today { background: var(--accent); color: var(--accent-ink); }
  .tag.miss { color: var(--warn); border: 1px solid var(--warn); }
  td.quarter a { text-decoration: none; }
  .empty-note { padding: 20px; text-align: center; color: var(--muted); }

  /* Hängender Einzug: Folgezeilen beginnen unter dem Text, nicht unter dem Zeichen */
  .ln { display: flex; gap: .35em; }
  .ln + .ln { margin-top: 2px; }
  .ln .m { flex: none; }
  .ln .t { min-width: 0; overflow-wrap: anywhere; }
  /* In der Tagestabelle nur zwischen ganzen Wörtern umbrechen (die Spalte wird so breit wie das längste Wort). */
  table.days .ln .t { overflow-wrap: normal; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  mark.cur { background: var(--mark-cur); color: var(--mark-cur-ink); }

  .fazit-box { display: inline-block; width: auto; max-width: 100%; text-align: left; padding: 12px 14px; min-height: 60px; border-radius: 14px; background: var(--card); }
  .msg-text { padding: 8px 2px; }
  .kosten { display: flex; align-items: center; gap: 10px; }
  .kosten span { font-size: 20px; }
  #kosten { text-align: right; width: 130px; flex: none; }
  .table-wrap.fit { display: inline-block; max-width: 100%; }
  .table-wrap.fit table { width: auto; }
  table.days.static th { position: static; }
  table.days.static tbody tr { cursor: default; }
  table.days td.num, table.days th.num { text-align: right; }
  table.days td.nw { white-space: nowrap; }
  table.days.static td.quarter a, table.days.static a { text-decoration: none; }
  td a { text-decoration: none; }

  .fab { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; z-index: 4; }
  .fab button { padding: 0; font-size: 20px; }
  .fab[hidden] { display: none; }

  /* Dialoge */
  dialog {
    border: none; border-radius: 18px; padding: 0;
    width: fit-content; min-width: min(480px, 90vw); max-width: 90vw;
    max-height: calc(100vh - 40px); background: var(--dlg-bg); color: var(--ink);
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  dialog.wide { width: min(1100px, 100vw - 24px); max-width: none; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog form { display: flex; flex-direction: column; max-height: calc(100vh - 40px); }
  .dlg-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: .5px solid var(--line); }
  .dlg-head h3 { margin: 0; flex: 1; text-align: center; font-size: 19px; min-height: 28px; line-height: 28px; }
  /* Fenster-Kopfzeile: rundes x links, Titel (mit Zusatzzeile) in der Mitte, rechts weitere Schaltflächen und rundes Häkchen.
     Das Häkchen ist grau, bis etwas geändert wurde; dann blau. */
  .dlg-head .hl, .dlg-head .hr { flex: 1 1 0; display: flex; align-items: center; gap: 12px; }
  .dlg-head .hr { justify-content: flex-end; }
  .dlg-head .mid { flex: none; max-width: 60%; text-align: center; }
  .dlg-head .mid .sub { display: block; font-size: 13px; color: var(--muted); line-height: 1.2; }
  .dlg-head .mid .sub:empty { display: none; }
  #msg { width: 360px; min-width: 0; }
  #msg .dlg-head { border: none; }
  #msg .msg-text { text-align: center; padding: 0 4px 10px; }
  .dlg-body { padding: 8px 16px 20px; overflow-y: auto; flex: 1; }
  .dlg-foot { display: flex; gap: 12px; align-items: center; padding: 14px 16px 16px; border-top: .5px solid var(--line); }
  .step { background: var(--dlg-card); border-radius: 14px; padding: 14px; margin-top: 12px; }
  dialog input[type=text], dialog input[type=date], dialog textarea { background: var(--dlg-field); }
  .step-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .step-head label { margin: 0; flex: 1; }
  .step-num {
    display: inline-flex; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    align-items: center; justify-content: center; font-size: 14px; margin-right: 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
  .chips button { font-size: 15px; padding: 6px 10px; min-height: 44px; }
  .emoji-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
  .emoji-row button {
    font-size: 24px; line-height: 1; padding: 0; width: 44px; min-width: 44px; height: 44px;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  .emoji-row button.reset { font-size: 20px; color: var(--muted); flex: none; }
  /* Reine Icon-, Wetter- und Smiley-Schaltflächen einheitlich quadratisch 44 × 44 px */
  .fab button, .mic, .emoji-row button.reset, .iconbtn { width: 44px; min-width: 44px; height: 44px; padding: 0; border-radius: 50%; }
  .emoji-row button { border-radius: 50%; }
  /* Komponente Auswahl-Kapsel: Smileys, Wetter, Reisemittel in einer Kapsel; bei knappem Platz wischbar */
  .emoji-row.strip { flex-wrap: nowrap; align-items: center; }
  .cap { flex: 0 1 auto; min-width: 0; display: flex; height: 44px; border-radius: 22px; overflow: hidden;
    background: var(--btn); border: .5px solid var(--btn-rim); box-shadow: var(--float); }
  .cap .scroll { display: flex; min-width: 0; height: 100%; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .cap .scroll::-webkit-scrollbar { display: none; }
  /* Schaltflächen füllen genau den Innenraum der Kapsel (44 px minus Rand), damit nichts abgeschnitten wird */
  .cap .scroll button { flex: none; background: none; border: none; box-shadow: none; border-radius: 22px; min-height: 0; height: 100%; }
  .cap .scroll button[aria-pressed="true"] { background: var(--sel-bg); box-shadow: inset 0 0 0 .5px var(--accent); }
  .emoji-row .cap .scroll button { width: 48px; min-width: 48px; }
  .chips .cap .scroll button { padding: 0 14px; white-space: nowrap; }
  .strip > .reset { margin-left: auto; }
  .cap .scroll.fr { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); }
  .cap .scroll.fl { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 48px), transparent); }
  .cap .scroll.fl.fr { -webkit-mask-image: linear-gradient(to right, transparent, #000 48px, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to right, transparent, #000 48px, #000 calc(100% - 48px), transparent); }
  .mic { font-size: 18px; padding: 0; min-height: 44px; }
  .mic[aria-pressed="true"] { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  .hint { font-size: 14px; color: var(--muted); margin-top: 6px; }

};
const ic = (name, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;

// Version und Erstellungszeitpunkt, werden bei jeder neuen Version angepasst.
// Versionsnummer Hauptversion.Nebenversion.Korrektur (siehe CHANGELOG.md).
const APP_VERSION = '2.1.3';
const APP_BUILT = '08.10.2026 um 16:08';

const app = document.getElementById('app');
const side = document.getElementById('side');
const dlg = document.getElementById('dlg');

const STORAGE_KEY = 'reiselogbuch.v1';
const OLD_STORAGE_KEY = 'reisetagebuch.v1'; // Name vor der Umbenennung, wird beim ersten Start übernommen
const WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const WEEKDAYS_LONG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const WEATHER = ['☀️', '🌤', '🌦', '🌧', '☁️', '⛈', '❄️'];
const TRANSPORT = [
  { id: 'pkw', icon: '🚗', name: 'PKW' },
  { id: 'zug', icon: '🚆', name: 'Zug' },
  { id: 'rad', icon: '🚲', name: 'Fahrrad' },
  { id: 'flug', icon: '✈️', name: 'Flugzeug' },

];
const DEFAULT_MOODS = ['🙂', '😊', '😉', '👍', '😋', '😌', '😏', '😳', '🤪', '🥶', '🤷🏻‍♂️', '☹️', '🤮'];
const DEFAULT_FOOD = ['🕗', '🕙', '🕛', '🕒', '🕕', '😋', '👌', '👍', '😕', '🤮', '👎', '⭐️', '🍕', '🍔', '🥩', '🍷', '🍺', '☕️'];
// Zwei getrennte Schnellauswahl-Leisten: Stimmung (Wie war was?/Fazit) und Essen.
const EMOJI_SETS = {
  mood: { defaults: DEFAULT_MOODS, usage: 'moodUsage', hidden: 'hiddenMoods' },
  food: { defaults: DEFAULT_FOOD, usage: 'foodUsage', hidden: 'hiddenFood' },
};
const PROGRAM_SUGGESTIONS = [
  { label: 'Weiterfahrt nach …', text: 'Weiterfahrt nach ' },
  { label: 'Rundgang durch …', text: 'Rundgang durch ' },
  { label: 'Besichtigung …', text: 'Besichtigung ' },
  { label: 'Freetour …', text: 'Freetour ' },
];

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

/* ---------- Speicher ---------- */

function normalize(data) {
  data.trips ||= [];
  data.moodUsage ||= {};
  data.hiddenMoods ||= [];
  data.foodUsage ||= {};
  data.hiddenFood ||= [];
  data.settings = { theme: 'auto', hideEmpty: false, ...(data.settings || {}) };
  // Früher gab es "Automatisch": einmalig die aktuelle iPad-Einstellung übernehmen.
  if (!['light', 'dark'].includes(data.settings.theme)) {
    data.settings.theme = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  for (const t of data.trips) {
    t.days ||= {};
    t.transport ||= [];
    t.quarterList ??= false;
    t.foodColumn ??= false;
    t.moodColumn ??= true;
    t.quarterColumn ??= true;
    t.outputCounter ||= 0;
  }
  return data;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) ?? localStorage.getItem(OLD_STORAGE_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { /* leer starten */ }
  return normalize({});
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    return true;
  } catch (e) {
    inform('Speichern fehlgeschlagen', 'Der Speicher ist voll oder nicht verfügbar. Bitte ein Backup erstellen.');
    return false;
  }
}

let db = load();
let currentTripId = null;
let searchTerm = '';
let searchIndex = 0;
let autosaveTimer = null;
let searchOpen = false;
let searchJump = null;     // Zeitgeber für den Sprung zum ersten Treffer    // Suchzeile unter der Kopfzeile eingeblendet
let sideOverlay = false;   // Hochformat: Seitenleiste über den Inhalt gelegt
let dlgOpener = '';        // Schaltfläche, von der das offene Fenster kommt (bleibt blau hinterlegt)
let dlgDirty = null;       // Prüft, ob im offenen Fenster etwas geändert wurde
let emptyPrompted = false; // Ohne Reiselogbuch öffnet sich "Neues Reiselogbuch" einmal von selbst

/* ---------- Datum ---------- */

// Datumsangaben immer als 'YYYY-MM-DD', gerechnet in UTC, damit die Sommerzeit nicht stört.
function parseISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function toISO(date) { return date.toISOString().slice(0, 10); }
function todayISO() {
  const n = new Date();
  return toISO(new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())));
}
function addDays(iso, n) {
  const d = parseISO(iso);
  d.setUTCDate(d.getUTCDate() + n);
  return toISO(d);
}
const pad = (n, len = 2) => String(n).padStart(len, '0');
function dayLabel(iso) {
  const d = parseISO(iso);
  return `${WEEKDAYS[d.getUTCDay()]}, ${pad(d.getUTCDate())}.${pad(d.getUTCMonth() + 1)}.`;
}
function longDayLabel(iso) {
  return `${WEEKDAYS_LONG[parseISO(iso).getUTCDay()]}, ${fullDate(iso)}`;
}
function fullDate(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function shortDate(iso) {
  const [, m, d] = iso.split('-');
  return `${d}.${m}.`;
}
function tripDays(trip) {
  const days = [];
  if (!trip.start || !trip.end || trip.end < trip.start) return days;
  for (let d = trip.start; d <= trip.end; d = addDays(d, 1)) days.push(d);
  return days;
}
function nowStamp() {
  const n = new Date();
  return {
    date: `${pad(n.getDate())}.${pad(n.getMonth() + 1)}.${n.getFullYear()}`,
    time: `${pad(n.getHours())}:${pad(n.getMinutes())}`,
    file: `${n.getFullYear()}.${pad(n.getMonth() + 1)}.${pad(n.getDate())} ${pad(n.getHours())}.${pad(n.getMinutes())}`,
  };
}

/* ---------- Reisen ---------- */

const getTrip = id => db.trips.find(t => t.id === id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// Startreise: die Reise, in die heute fällt; sonst die zuletzt beendete; sonst die nächste geplante.
function pickStartTrip() {
  const today = todayISO();
  const current = db.trips.find(t => t.start <= today && today <= t.end);
  if (current) return current;
  const ended = db.trips.filter(t => t.end < today).sort((a, b) => b.end.localeCompare(a.end));
  if (ended.length) return ended[0];
  const planned = db.trips.filter(t => t.start > today).sort((a, b) => a.start.localeCompare(b.start));
  return planned[0] || null;
}

function overlappingTrip(start, end, ignoreId) {
  return db.trips.find(t => t.id !== ignoreId && start <= t.end && t.start <= end);
}

function transportText(trip) {
  return TRANSPORT.filter(t => trip.transport.includes(t.id)).map(t => `${t.icon} ${t.name}`).join(', ');
}

/* ---------- Tage ---------- */

function rawEntry(trip, iso) { return trip.days[iso] || {}; }

// Quartier (Name + Ort) eines Tages; mit Häkchen "wie Vortag" wird es vom Vortag übernommen, auch über mehrere Tage.
function quarterOf(trip, iso) {
  for (let d = iso, i = 0; i < 1000; d = addDays(d, -1), i++) {
    const e = rawEntry(trip, d);
    if (!e.sameQuarter) return { name: e.quarter || '', place: e.place || '', noMap: Boolean(e.noMap) };
    if (d <= trip.start) break;
  }
  return { name: '', place: '', noMap: false };
}

// Sichtbare Tabellenspalten; "Tag" und "Programm" werden immer angezeigt.
const cols = trip => ({ mood: trip.moodColumn !== false, food: Boolean(trip.foodColumn), quarter: trip.quarterColumn !== false });
const colCount = trip => { const c = cols(trip); return 2 + c.mood + c.food + c.quarter; };
const headCells = trip => { const c = cols(trip);
  return `<th>Tag</th><th>Programm</th>${c.mood ? '<th>🙂☹️😉</th>' : ''}${c.food ? '<th>🍽️🍷☕️</th>' : ''}${c.quarter ? '<th>😴💤</th>' : ''}`; };

// Erfasst: Wetter, Programm oder eine sichtbare Spalte (Essen zählt nicht); ausgeblendete Spalten zählen nicht.
function isRecorded(trip, iso) {
  const e = rawEntry(trip, iso);
  const c = cols(trip);
  return Boolean(e.weather || e.program || (c.mood && e.comment) || (c.quarter && quarterOf(trip, iso).name));
}

function firstGap(trip) {
  return tripDays(trip).find(d => !isRecorded(trip, d)) || null;
}

function matchesSearch(trip, iso, term) {
  const e = rawEntry(trip, iso);
  const q = quarterOf(trip, iso);
  const c = cols(trip);
  return [e.program, c.mood && e.comment, c.food && e.food, c.quarter && q.name, c.quarter && q.place]
    .filter(Boolean).join('\n').toLocaleLowerCase('de').includes(term);
}

/* ---------- Text-Formatierung mit hängendem Einzug ---------- */

const segmenter = new Intl.Segmenter();
const EMOJI_RE = /\p{Extended_Pictographic}/u;
const graphemes = text => Array.from(segmenter.segment(text || ''), s => s.segment);

function emojisIn(text) {
  return graphemes(text).filter(s => EMOJI_RE.test(s));
}

function splitLines(text) {
  return (text || '').split('\n').map(l => l.trim()).filter(Boolean);
}

// Programm: bei mehreren Zeilen jede mit ▫️, bei einer Zeile ohne Zeichen.
function programItems(text) {
  const lines = splitLines(text).map(l => l.replace(/^(▫️|▫|-|•)\s*/u, ''));
  return lines.map(t => ({ m: lines.length > 1 ? '▫️' : '', t }));
}

// Führende Smileys (auch mehrere) einer Zeile abtrennen: "🕛 😋 Text" → { m: "🕛😋", t: "Text" }.
function splitLeadingEmojis(line) {
  const g = graphemes(line);
  const marks = [];
  let i = 0;
  while (i < g.length && (EMOJI_RE.test(g[i]) || /^\s+$/.test(g[i]))) {
    if (EMOJI_RE.test(g[i])) marks.push(g[i]);
    i++;
  }
  const rest = g.slice(i).join('').trim();
  return marks.length && rest ? { m: marks.join(''), t: rest } : { m: '', t: line };
}

// Kommentar: führende Smileys werden zum Zeichen, der Text rückt daneben ein.
function commentItems(text) {
  return splitLines(text).map(splitLeadingEmojis);
}

// Trennt den Namen vom Rest: am ersten " - " (bzw. – —), optional auch am ersten Komma.
// "Santai Resort - Kingscliff" → ["Santai Resort", " - Kingscliff"]
function splitName(text, withComma) {
  const m = text.match(withComma ? /\s+[–—-]\s+|\s*,/ : /\s+[–—-]\s+/);
  if (!m || m.index === 0) return [text, ''];
  return [text.slice(0, m.index), text.slice(m.index)];
}

const linkAttrs = inApp => inApp ? ' target="_blank" rel="noopener" onclick="event.stopPropagation()"' : '';

// Quartier: 📍 als Zeichen, nur der Hotelname ist der Link; Ort danach ist normaler Text.
// Gesucht wird mit dem ganzen Eintrag. Mit "Kein Maps-Link" weder 📍 noch Link.
function quarterHtml(q, term = '', inApp = false) {
  if (!q.name) return '';
  // Ein eingetragener Ort steht nach einem Komma hinter dem Namen; Teile, die dort schon vorkommen, entfallen.
  const lower = q.name.toLocaleLowerCase('de');
  const parts = (q.place || '').split(',').map(x => x.trim()).filter(x => x && !lower.includes(x.toLocaleLowerCase('de')));
  const tail = parts.length ? ', ' + parts.join(', ') : '';
  if (q.noMap) return `<div class="ln"><span class="t">${highlight(q.name + tail, term)}</span></div>`;
  const [name, rest] = splitName(q.name, true);
  return `<div class="ln"><span class="m">📍</span><span class="t"><a href="${mapsUrl(q)}"${linkAttrs(inApp)}>${highlight(name, term)}</a>${highlight(rest + tail, term)}</span></div>`;
}

// Essen: "Smileys Name – Kommentar"; 📍 als Zeichen, nur der Name ist der Link (Suche: Name + Ort des Quartiers).
// Ein "⊘" am Zeilenanfang schaltet den Maps-Link für dieses Lokal aus.
const NO_LINK = '⊘';
function foodItems(text, place) {
  return splitLines(text).map(line => {
    const noLink = line.startsWith(NO_LINK);
    const { m, t } = splitLeadingEmojis(noLink ? line.slice(NO_LINK.length).trim() : line);
    const [name, rest] = splitName(t, false);
    return { m, name, rest, maps: !noLink && name.trim() ? mapsUrl({ name, place }) : '' };
  });
}

function foodHtml(items, term = '', inApp = false) {
  return items.map(({ m, name, rest, maps }) =>
    // Smileys und 📍 bilden gemeinsam die linke Spalte, damit Folgezeilen unter dem Namen beginnen.
    `<div class="ln">${m || maps ? `<span class="m">${esc(m)}${maps ? '📍' : ''}</span>` : ''}<span class="t">${maps
      ? `<a href="${maps}"${linkAttrs(inApp)}>${highlight(name, term)}</a>${highlight(rest, term)}`
      : highlight(name + rest, term)}</span></div>`).join('');
}

// "⊘" am Anfang der Zeile mit dem Cursor setzen oder wieder entfernen.
function toggleNoLink(ta) {
  const v = ta.value;
  const pos = ta.selectionStart ?? v.length;
  const start = v.lastIndexOf('\n', pos - 1) + 1;
  const line = v.slice(start);
  const on = line.startsWith(NO_LINK);
  const cut = on ? NO_LINK.length + (line[NO_LINK.length] === ' ' ? 1 : 0) : 0;
  const ins = on ? '' : NO_LINK + ' ';
  ta.value = v.slice(0, start) + ins + v.slice(start + cut);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = Math.max(start, pos + ins.length - cut);
}

// Optional werden Suchtreffer im (bereits maskierten) Text gelb markiert.
function highlight(text, term) {
  const safe = esc(text);
  if (!term) return safe;
  const pattern = esc(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(pattern, 'gi'), m => `<mark>${m}</mark>`);
}

function linesHtml(items, term = '') {
  return items.map(({ m, t }) =>
    `<div class="ln">${m ? `<span class="m">${esc(m)}</span>` : ''}<span class="t">${highlight(t, term)}</span></div>`).join('');
}

/* ---------- Smileys ---------- */

// Nach Häufigkeit sortiert, noch nie benutzte in Standardreihenfolge dahinter; entfernte ausgeblendet.
function quickMoods(kind = 'mood') {
  const set = EMOJI_SETS[kind];
  const usage = db[set.usage];
  const hidden = new Set(db[set.hidden]);
  const order = m => { const i = set.defaults.indexOf(m); return i < 0 ? 999 : i; };
  const all = [...new Set([...Object.keys(usage), ...set.defaults])].filter(m => !hidden.has(m));
  return all
    .filter(m => set.defaults.includes(m) || usage[m] > 0)
    .sort((a, b) => (usage[b] || 0) - (usage[a] || 0) || order(a) - order(b));
}

// Zähler an die Änderung eines Kommentars anpassen; wieder verwendete Smileys kommen zurück.
function countMoods(before, after, kind = 'mood') {
  const set = EMOJI_SETS[kind];
  const usage = db[set.usage];
  const diff = {};
  emojisIn(after).forEach(m => diff[m] = (diff[m] || 0) + 1);
  emojisIn(before).forEach(m => diff[m] = (diff[m] || 0) - 1);
  for (const [m, n] of Object.entries(diff)) {
    if (!n) continue;
    usage[m] = Math.max(0, (usage[m] || 0) + n);
    if (!usage[m]) delete usage[m];
    if (n > 0) db[set.hidden] = db[set.hidden].filter(h => h !== m);
  }
}

/* ---------- Hilfen ---------- */

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function mapsUrl({ name, place }) {
  const query = [name, place].map(s => (s || '').trim()).filter(Boolean).join(', ');
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
}
// Ganze Zahl mit Tausenderpunkt, z. B. 4850 → "4.850".
function thousands(n) {
  return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
// Betrag mit zwei Nachkommastellen wie bei Apple: "4.850,00" (ohne Währung).
function money(n) {
  const [i, d] = (Math.round((Number(n) || 0) * 100) / 100).toFixed(2).split('.');
  return thousands(i) + ',' + d;
}
function formatEuro(value) {
  return money(value) + ' €';
}

function insertAtCursor(ta, text, ownLine) {
  const v = ta.value;
  const pos = ta.selectionStart ?? v.length;
  const before = v.slice(0, pos);
  const prefix = ownLine && before && !before.endsWith('\n') ? '\n' : '';
  const ins = prefix + text;
  ta.value = before + ins + v.slice(pos);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = pos + ins.length;
  autoGrow(ta);
}

// Textfeld so hoch wie sein Inhalt (mindestens die eingestellte Höhe).
function autoGrow(ta) {
  ta.style.height = 'auto';
  ta.style.height = (ta.scrollHeight + 2) + 'px';
}
const growAll = () => dlg.querySelectorAll('textarea').forEach(autoGrow);

// Datumsfeld so breit wie das Datum, mit kurzem Abstand zum eigenen Kalender-Icon (auf allen Geräten gleich).
const dateBox = (id, value, label) => `<span class="datebox"><input type="date" id="${id}" value="${value}" aria-label="${label}">${ic('calendar')}</span>`;
function fitDate(inp) {
  const cs = getComputedStyle(inp);
  const ctx = (fitDate.ctx ||= document.createElement('canvas').getContext('2d'));
  ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  // Das Datum wird in der Sprache des Geräts angezeigt; gemessen wird die breitere Schreibweise.
  const d = inp.value ? new Date(inp.value + 'T12:00') : new Date(2000, 11, 28);
  const w = Math.max(...[fullDate(inp.value || '2000-12-28'), d.toLocaleDateString(), d.toLocaleDateString(undefined, { day: '2-digit', month: '2-digit', year: 'numeric' })]
    .map(t => ctx.measureText(t).width));
  inp.style.width = Math.ceil(w + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 14) + 'px';
}

// Betragsfeld mindestens so breit wie "100.000,00", bei längeren Beträgen wächst es mit.
function fitMoney(inp) {
  const cs = getComputedStyle(inp);
  const ctx = (fitMoney.ctx ||= document.createElement('canvas').getContext('2d'));
  ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const w = Math.max(ctx.measureText('100.000,00').width, ctx.measureText(inp.value).width);
  inp.style.width = Math.ceil(w + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 6) + 'px';
}

function insertEmoji(ta, emoji) {
  const v = ta.value;
  const pos = ta.selectionStart ?? v.length;
  const lineStart = v.lastIndexOf('\n', pos - 1) + 1;
  const head = v.slice(lineStart, pos);
  const onlyEmojis = graphemes(head).every(g => EMOJI_RE.test(g) || /^\s+$/.test(g));
  let before, ins;
  if (onlyEmojis) {
    before = v.slice(0, lineStart) + head.trimEnd();
    ins = emoji + ' ';
  } else {
    before = v.slice(0, pos);
    ins = '\n' + emoji + ' ';
  }
  ta.value = before + ins + v.slice(pos);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = before.length + ins.length;
  autoGrow(ta);
}

function onLongPress(btn, onLong, onTap) {
  let timer = null;
  let fired = false;
  btn.addEventListener('pointerdown', () => {
    fired = false;
    timer = setTimeout(() => { fired = true; onLong(); }, 600);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, () => clearTimeout(timer)));
  btn.addEventListener('contextmenu', e => e.preventDefault());
  btn.addEventListener('click', e => {
    e.preventDefault();
    if (fired) { fired = false; return; }
    onTap();
  });
}

function applyTheme() {

}

/* ---------- Hauptansicht ---------- */

function render({ scrollToGap = false } = {}) {
  const trip = getTrip(currentTripId);
  if (!trip) return renderEmpty();
  emptyPrompted = false;
  renderSide();
  const today = todayISO();
  const days = tripDays(trip);
  const gap = firstGap(trip);
  const term = searchTerm.trim().toLocaleLowerCase('de');
  const recorded = days.filter(d => isRecorded(trip, d)).length;

  const visible = days.filter(iso => {
    if (term) return matchesSearch(trip, iso, term);
    return !db.settings.hideEmpty || isRecorded(trip, iso);
  });

  const c = cols(trip);
  // Zebrastreifen nach sichtbaren Zeilen, damit das Muster auch bei Filter und Suche abwechselt.
  const rows = visible.map((iso, i) => {
    const e = rawEntry(trip, iso);
    const q = quarterOf(trip, iso);
    const rec = isRecorded(trip, iso);
    const tags = (iso === today ? '<span class="tag today">heute</span>' : '')
      + (!rec && iso < today ? '<span class="tag miss">fehlt</span>' : '');
    const wx = e.weather
      ? `<span class="wx">${esc(e.weather)}</span>`
      : `<span class="wx empty">☀️🌤🌦🌧</span>`;
    const link = quarterHtml(q, term, true);
    const cls = [i % 2 ? 'alt' : '', iso === gap ? 'gap' : ''].join(' ').trim();
    return `<tr data-day="${iso}" class="${cls}">
      <td class="day">${dayLabel(iso)}${tags}${wx}</td>
      <td>${linesHtml(programItems(e.program), term)}</td>
      ${c.mood ? `<td>${linesHtml(commentItems(e.comment), term)}</td>` : ''}
      ${c.food ? `<td>${foodHtml(foodItems(e.food, q.place), term, true)}</td>` : ''}
      ${c.quarter ? `<td class="quarter">${link}</td>` : ''}
    </tr>`;
  }).join('');

  let progress;
  if (today < trip.start) progress = `Reise beginnt in ${Math.round((parseISO(trip.start) - parseISO(today)) / 864e5)} Tagen`;
  else if (today > trip.end) progress = `Reise beendet · ${days.length} Tage`;
  else progress = `Tag ${days.indexOf(today) + 1} von ${days.length}`;
  progress += ` · ${recorded} erfasst`;

  const transport = transportText(trip);
  const stays = c.quarter ? quarterStays(trip) : [];

  app.innerHTML = `
    <div class="nb" id="bar">
      <div class="nb1">
        <span>${sideToggleHtml()}</span>
        <span class="nb-title">${esc(trip.title)}</span>
        <span class="r"><span class="grp">
          <button type="button" id="shareBtn" aria-label="Ausgabe">${ic('share')}</button>
          <button type="button" id="searchBtn" class="${searchOpen ? 'on' : ''}" aria-label="Suchen">${ic('search')}</button>
          <button type="button" id="mainMore" aria-label="Mehr">${ic('ellipsis')}</button>
        </span></span>
      </div>
      ${searchOpen ? `<div class="nb2">
        <span class="searchbox active">${ic('search')}<input type="search" id="search" placeholder="Suchen" value="${esc(searchTerm)}" autocomplete="off" enterkeyhint="search">${term ? `
          <span class="smeta"><span class="scount" id="scount"></span><button type="button" class="sclear" id="sclear" aria-label="Suche löschen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M15 9l-6 6M9 9l6 6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button></span>` : ''}</span>
        <span class="navgrp"><button type="button" id="sprev" aria-label="Voriger Treffer" ${term ? '' : 'disabled'}>${ic('chevron-up')}</button><button type="button" id="snext" aria-label="Nächster Treffer" ${term ? '' : 'disabled'}>${ic('chevron-down')}</button></span>
      </div>` : ''}
    </div>
    <h1>Reiselogbuch – ${esc(trip.title)}</h1>
    <dl class="meta">
      <dt>Reiseteilnehmer:</dt><dd>${esc(trip.participants)}</dd>
      <dt>Reisezeitraum:</dt><dd>${fullDate(trip.start)} - ${fullDate(trip.end)}</dd>
      ${transport ? `<dt>Reisemittel:</dt><dd>${esc(transport)}</dd>` : ''}
    </dl>
    <p class="progress">${progress}</p>
    <div class="table-wrap">
      <table class="days">
        <thead><tr>${headCells(trip)}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${visible.length ? '' : `<div class="empty-note">${term ? 'Keine Treffer.' : 'Noch keine Tage erfasst.'}</div>`}
    </div>

    <h2>Fazit</h2>
    <button type="button" class="fazit-box" id="fazit">${trip.fazit
      ? linesHtml(commentItems(trip.fazit))
      : `<span class="muted" style="display:inline-flex;gap:6px;align-items:center">${ic('pencil')}Antippen, um das Fazit zu schreiben.</span>`}</button>

    <h2>Gesamtkosten</h2>
    <div class="kosten">
      <input type="text" id="kosten" inputmode="decimal" placeholder="0,00" value="${trip.kosten == null ? '' : money(trip.kosten)}">
      <span>€</span>
    </div>

    ${stays.length ? `
      <h2>Quartierliste</h2>
      <div class="table-wrap fit">
        <table class="days static">
          <thead><tr><th>Quartier</th><th>Zeitraum</th><th class="num">Nächte</th></tr></thead>
          <tbody>${stays.map((st, i) => `<tr class="${i % 2 ? 'alt' : ''}">
            <td>${quarterHtml(st.q, '', true)}</td>
            <td class="nw">${shortDate(st.firstNight)} - ${fullDate(addDays(st.lastNight, 1))}</td>
            <td class="num">${st.nights}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>` : ''}

    <h2>Statistik</h2>
    <dl class="meta">${tripStats(trip).map(([k, v]) => `<dt>${k}:</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;

  fab.hidden = false;
  const bar = app.querySelector('#bar');
  bar.classList.toggle('line', scrollY > 4);
  document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px');
  bindSideToggle(app);

  app.querySelector('#shareBtn').onclick = e => openShareMenu(e.currentTarget, trip);
  app.querySelector('#mainMore').onclick = e => openMainMenu(e.currentTarget, trip);
  app.querySelector('#searchBtn').onclick = () => {
    searchOpen = !searchOpen;
    if (!searchOpen) { searchTerm = ''; searchIndex = 0; }
    render();
    if (searchOpen) app.querySelector('#search').focus();
  };
  const search = app.querySelector('#search');
  const refocus = () => {
    const s = app.querySelector('#search');
    s.focus();
    s.selectionStart = s.selectionEnd = s.value.length;
  };
  if (search) {
    // Markiert wird sofort; zum ersten Treffer gesprungen wird erst nach einer kurzen Tipp-Pause.
    search.oninput = () => {
      searchTerm = search.value;
      searchIndex = 0;
      render();
      refocus();
      clearTimeout(searchJump);
      searchJump = setTimeout(() => showHit(true), 500);
    };
    // Eingabetaste springt zum nächsten Treffer (wie in Safari).
    search.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); stepHit(1); } };
  }
  if (term) {
    app.querySelector('#sclear').onclick = () => { searchTerm = ''; searchIndex = 0; render(); refocus(); };
    app.querySelector('#sprev').onclick = () => stepHit(-1);
    app.querySelector('#snext').onclick = () => stepHit(1);
    showHit(false);
  }
  markOpener();
  app.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => openDayDialog(trip, tr.dataset.day));
  app.querySelector('#fazit').onclick = () => openFazitDialog(trip);
  // Betrag: Tausenderpunkt beim Tippen, Komma für Cent (höchstens zwei Stellen); beim Verlassen wird ",00" ergänzt.
  const kosten = app.querySelector('#kosten');
  kosten.oninput = () => {
    const raw = kosten.value.replace(/[^\d,]/g, '');
    const [i, ...rest] = raw.split(',');
    const int = i.replace(/^0+(?=\d)/, '').slice(0, 9);
    const dec = rest.join('').slice(0, 2);
    const hasComma = raw.includes(',');
    trip.kosten = int || dec ? Number(`${int || 0}.${dec || 0}`) : null;
    kosten.value = int || hasComma ? `${int ? thousands(int) : '0'}${hasComma ? ',' + dec : ''}` : '';
    save();
  };
  kosten.onblur = () => { kosten.value = trip.kosten == null ? '' : money(trip.kosten); fitMoney(kosten); };
  kosten.addEventListener('input', () => fitMoney(kosten));
  fitMoney(kosten);

  if (scrollToGap) {
    const row = app.querySelector('tr.gap');
    if (row) row.scrollIntoView({ block: 'center' });
  }
}

// Treffer-Navigation der Suche: jeder markierte Begriff in der Tabelle ist ein Treffer; der aktuelle ist hellorange.
function showHit(scroll) {
  const marks = [...app.querySelectorAll('table.days:not(.static) mark')];
  const n = marks.length;
  if (searchIndex >= n) searchIndex = Math.max(0, n - 1);
  marks.forEach((m, i) => m.classList.toggle('cur', i === searchIndex));
  const count = app.querySelector('#scount');
  if (!count) return;
  count.textContent = n ? `${searchIndex + 1} von ${n}` : '0';
  const input = app.querySelector('#search');
  input.style.paddingRight = (app.querySelector('.smeta').offsetWidth + 14) + 'px';
  app.querySelector('#sprev').disabled = !n || searchIndex <= 0;
  app.querySelector('#snext').disabled = !n || searchIndex >= n - 1;
  if (scroll && n) scrollUnderBar(marks[searchIndex]);
}

// Treffer direkt unter die Suchzeile (und den Tabellenkopf) rollen, mit einer halben Zeile Abstand.
function scrollUnderBar(el) {
  const row = el.closest('tr') || el;
  const bar = document.getElementById('bar');
  const head = app.querySelector('table.days:not(.static) thead');
  const offset = (bar?.offsetHeight || 0) + (head?.offsetHeight || 0) + 12;
  const top = row.getBoundingClientRect().top + scrollY - offset - (window.visualViewport?.offsetTop || 0);
  window.scrollTo({ top: Math.max(0, top) });
}

function stepHit(dir) {
  const n = app.querySelectorAll('table.days:not(.static) mark').length;
  const next = searchIndex + dir;
  if (next < 0 || next >= n) return;
  searchIndex = next;
  showHit(true);
}

// Ohne Reiselogbuch: leere Seite mit Hinweis; "Neues Reiselogbuch" öffnet sich einmal von selbst.
function renderEmpty() {
  fab.hidden = true;

    <div class="nb" id="bar"><div class="nb1"><span>${sideToggleHtml()}</span><span></span><span></span></div></div>
    <div class="emptymain">Noch kein Reiselogbuch angelegt.<br>Mit „plus“ in der Seitenleiste ein neues anlegen.</div>`;
  bindSideToggle(app);
  if (!emptyPrompted && !dlg.open) { emptyPrompted = true; openTripDialog(null); }
}

function showTrip(id) {
  currentTripId = id;

/* ---------- Seitenleiste ---------- */

// Quer (breiter Bildschirm) steht die Seitenleiste fest links und lässt sich aus- und einblenden;
// im Hochformat wird sie über den Inhalt gelegt und schließt sich nach der Auswahl wieder.
const isWide = () => window.innerWidth >= 1100;
const sideVisible = () => isWide() ? db.settings.sidebar !== false : sideOverlay;
const sideToggleHtml = () => sideVisible() && isWide() ? ''
  : `<button type="button" class="round" data-side-toggle aria-label="Seitenleiste einblenden">${ic('panel-left')}</button>`;

function toggleSide() {
  if (isWide()) { db.settings.sidebar = !sideVisible(); save(); } else sideOverlay = !sideOverlay;
  render();
}
const bindSideToggle = root => root.querySelectorAll('[data-side-toggle]').forEach(b => b.onclick = toggleSide);

function tripState(t, today) {
  return t.start <= today && today <= t.end ? 'läuft gerade' : t.end < today ? 'beendet' : 'geplant';
}

// Backup: einmal am Tag erstellen; Datum und Uhrzeit des letzten Backups.
function backedUpToday() {
  const last = db.settings.lastBackup;
  return Boolean(last) && new Date(last).toDateString() === new Date().toDateString();
}
function lastBackupText() {
  const last = db.settings.lastBackup;
  if (!last) return 'Noch kein Backup erstellt.';
  const d = new Date(last);
  return `Letztes Backup erstellt am ${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} um ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

    <div class="side-head"><h2>Reiselogbücher</h2>

      : '<div class="side-empty">Noch kein Reiselogbuch angelegt.</div>'}
    ${trips.length && !backedUpToday() ? `<div class="bhint"><div>${lastBackupText()}</div>
      <button type="button" id="hintBackup">${ic('save')}Backup erstellen</button></div>` : ''}`;
  side.querySelector('#newTrip').onclick = () => { setOpener('#newTrip'); openTripDialog(null); };
  side.querySelector('#sideMore').onclick = e => openMenu(e.currentTarget, [

/* ---------- Menüs und Sprechblasen ---------- */

// Menü oder Sprechblase unter (bzw. über) der Schaltfläche, im Bildschirm gehalten.
function placeAt(el, anchor, align) {
  const r = anchor.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  let left = align === 'right' ? r.right - w : r.left;
  left = Math.max(12, Math.min(left, innerWidth - w - 12));
  let top = r.bottom + 8;
  if (top + h > innerHeight - 12) top = Math.max(12, r.top - h - 8);
  el.style.left = left + 'px';
  el.style.top = top + 'px';
}

// Einträge: { icon, label, sub, red, tick, disabled, act } · 'sep' (Abstand) · { note } (graue Zeile).
function openMenu(anchor, items, align = 'right') {
  const host = anchor.closest('dialog') || document.body;
  const layer = document.createElement('div');
  layer.className = 'layer';
  const menu = document.createElement('div');
  menu.className = 'menu';
  menu.setAttribute('role', 'menu');
  menu.innerHTML = items.map((it, i) => it === 'sep' ? '<div class="sep"></div>'
    : it.note ? `<div class="note">${esc(it.note)}</div>`
    : `<button type="button" class="mi ${it.red ? 'red' : ''} ${it.sub ? 'has-sub' : ''}" data-i="${i}" ${it.disabled ? 'disabled' : ''} role="menuitem">${
        'tick' in it ? `<span class="tick">${it.tick ? ic('check') : ''}</span>` : ic(it.icon)}${esc(it.label)}</button>${
        it.sub ? `<div class="sub">${esc(it.sub)}</div>` : ''}`).join('');
  anchor.classList.add('on');
  const close = () => { layer.remove(); menu.remove(); anchor.classList.remove('on'); };
  layer.onclick = close;
  menu.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { close(); items[b.dataset.i].act(); });
  host.append(layer, menu);
  placeAt(menu, anchor, align);
}

// Abfrage als Sprechblase an der angetippten Schaltfläche; daneben tippen bricht ab.
function confirmPop(anchor, html, act, back = { label: 'Abbrechen', icon: 'ban', red: true }) {
  return new Promise(resolve => {
    const visible = anchor?.isConnected && anchor.getClientRects().length;
    const host = (visible && anchor.closest('dialog')) || (dlg.open ? dlg : document.body);
    const layer = document.createElement('div');
    layer.className = 'layer';
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.innerHTML = `<p>${html}</p><div class="btns">
      <button type="button" class="${act.cls || 'danger'}" data-v="1">${ic(act.icon)}${esc(act.label)}</button>
      <button type="button" data-v="0">${ic(back.icon, back.red ? 'red' : '')}${esc(back.label)}</button></div>`;
    if (visible) anchor.classList.add('on');
    const done = v => { layer.remove(); pop.remove(); if (visible) anchor.classList.remove('on'); resolve(v); };
    layer.onclick = () => done(false);
    pop.querySelectorAll('[data-v]').forEach(b => b.onclick = () => done(b.dataset.v === '1'));
    host.append(layer, pop);
    if (visible) placeAt(pop, anchor, anchor.getBoundingClientRect().left > innerWidth / 2 ? 'right' : 'left');
    else { pop.style.left = (innerWidth - pop.offsetWidth) / 2 + 'px'; pop.style.top = '120px'; }
  });
}

// Schaltflächen, von denen eine noch laufende Aktion kommt (Teilen-Menü, Meldung, Dateiauswahl), bleiben blau.
const held = new Set();
function hold(sel) { if (!sel) return; held.add(sel); document.querySelector(sel)?.classList.add('on'); }
function release(sel) { if (!sel) return; held.delete(sel); document.querySelector(sel)?.classList.remove('on'); }

// Die Schaltfläche, von der ein Fenster kommt, bleibt blau hinterlegt, solange es offen ist.
function setOpener(sel) {

}
function markOpener() {

// Kleines Fenster mit rundem x; Abfragen mit Entscheidung sind Sprechblasen (confirmPop).

// Der Dialog bleibt offen und bekommt nur neuen Inhalt; so kommt kein verspätetes Schließ-Ereignis an.
function openDialog(html, wide = false) {

// rechts weitere Schaltflächen und das runde Häkchen (grau, bis etwas geändert wurde).

}
dlg.addEventListener('input', refreshOk);

const MOOD_HINT = 'Leiste nach links/rechts wischen für weitere Smileys. Lange drücken entfernt einen Smiley aus der Leiste. ↺ stellt die Standard-Smileys wieder her. Weitere Smileys über die Emoji-Taste der Tastatur.';
const micButton = id => SpeechRec ? `<button type="button" class="mic" data-mic="${id}" aria-pressed="false" aria-label="Diktieren">${ic('mic')}</button>` : '';
const micHint = () => SpeechRec ? '' : '<div class="hint" style="margin-top:12px">🎤 Zum Diktieren die Mikrofon-Taste auf der Tastatur verwenden.</div>';

// Auswahl-Kapsel: Schaltflächen in einer Kapsel; ist sie zu schmal, lässt sich der Inhalt wischen,
// ein Verlauf am Rand zeigt, wo es weitergeht.
const capHtml = (buttons, id = '') => `<div class="cap"><div class="scroll" ${id ? `id="${id}"` : ''}>${buttons}</div></div>`;
function mountCap(root) {
  root.querySelectorAll('.cap .scroll').forEach(strip => {
    const fade = () => {
      strip.classList.toggle('fl', strip.scrollLeft > 2);
      strip.classList.toggle('fr', strip.scrollLeft + strip.clientWidth < strip.scrollWidth - 2);
    };
    strip.addEventListener('scroll', fade, { passive: true });
    requestAnimationFrame(fade);
  });
}

// Smiley-Schnellauswahl: Antippen fügt ein, lange drücken entfernt, ↺ setzt zurück.
function mountMoodRow(row, ta, onReset, kind = 'mood') {
  const set = EMOJI_SETS[kind];
  // Einzeilige Leiste zum Wischen; ↺ steht fest rechts daneben. Der Verlauf am Rand zeigt, wo es weitergeht.
  row.classList.add('strip');
  const draw = () => {
    const keep = row.querySelector('.scroll')?.scrollLeft || 0;
    row.innerHTML = capHtml(quickMoods(kind).map(m => `<button type="button" data-m="${m}">${m}</button>`).join(''))
      + `<button type="button" class="reset" aria-label="Standard-Smileys wiederherstellen">${ic('rotate-ccw')}</button>`;
    const strip = row.querySelector('.scroll');
    strip.scrollLeft = keep;
    mountCap(row);
    row.querySelectorAll('[data-m]').forEach(b => onLongPress(b,
      async () => {
        if (!await confirmPop(b, `${b.dataset.m} aus der Schnellauswahl entfernen?`, { label: 'Entfernen', icon: 'trash' })) return;
        db[set.hidden].push(b.dataset.m);
        delete db[set.usage][b.dataset.m];
        save();
        draw();
      },
      () => insertEmoji(ta, b.dataset.m)));
    row.querySelector('.reset').onclick = async e => {
      if (!await confirmPop(e.currentTarget, 'Standard-Smileys wiederherstellen und alle Zähler auf null setzen?', { label: 'Zurücksetzen', icon: 'rotate-ccw' })) return;
      db[set.usage] = {};
      db[set.hidden] = [];
      onReset();
      save();
      draw();
    };
  };
  draw();
}

// Diktieren über die Web Speech API; liefert eine Funktion zum Stoppen.
function mountMics() {
  let recognition = null;
  dlg.querySelectorAll('[data-mic]').forEach(b => b.onclick = () => {
    if (recognition) { recognition.stop(); return; }
    const ta = dlg.querySelector('#' + b.dataset.mic);
    recognition = new SpeechRec();
    recognition.lang = 'de-DE';
    recognition.interimResults = false;
    recognition.onresult = ev => {
      const text = Array.from(ev.results, r => r[0].transcript).join(' ').trim();
      if (text) insertAtCursor(ta, text + ' ', false);
    };
    recognition.onerror = ev => {
      if (ev.error === 'not-allowed') inform('Diktieren', 'Bitte den Mikrofon-Zugriff erlauben oder die Mikrofon-Taste der Tastatur verwenden.');
    };
    recognition.onend = () => { b.setAttribute('aria-pressed', 'false'); recognition = null; };
    b.setAttribute('aria-pressed', 'true');
    recognition.start();
  });
  return () => recognition?.stop();
}

// Reise anlegen oder bearbeiten; überschneidende Zeiträume werden verhindert.
function openTripDialog(trip) {
  const isNew = !trip;
  const t = trip || { title: '', participants: '', start: todayISO(), end: addDays(todayISO(), 14), transport: [], quarterList: false, foodColumn: true, moodColumn: true, quarterColumn: true };
  const transport = new Set(t.transport);
  openDialog(`
    <form method="dialog">
      ${dlgHead(isNew ? 'Neues Reiselogbuch' : 'Einstellungen')}
      <div class="dlg-body">
        <div class="step"><label for="fTitle">Reisetitel</label>
          <input type="text" id="fTitle" value="${esc(t.title)}" placeholder="z. B. Australien">
          <div class="warn" id="titleWarn" hidden></div></div>
        <div class="step"><label for="fPeople">Reiseteilnehmer</label>
          <input type="text" id="fPeople" value="${esc(t.participants)}" placeholder="z. B. Gerhild & Arnold">
          <div class="warn" id="peopleWarn" hidden></div></div>
        <div class="step"><label>Reisezeitraum</label>
          <div class="dates">
            <span class="dl">Von</span>${dateBox('fStart', t.start, 'Von')}
            <span class="dl">Bis</span>${dateBox('fEnd', t.end, 'Bis')}
          </div>
          <div class="warn" id="tripWarn" hidden></div>
        </div>
        <div class="step"><label>Reisemittel</label>
          <div class="chips">
            ${capHtml(TRANSPORT.map(x => `<button type="button" data-t="${x.id}" aria-pressed="${transport.has(x.id)}">${x.icon} ${x.name}</button>`).join(''), 'transport')}
          </div>
          <div class="warn" id="transportWarn" hidden style="margin-top:2px"></div>
        </div>
        <div class="step"><label>Konfiguration Tabellenspalten</label>
          <div class="hint" style="margin:0 0 6px">Die Spalten „Tag“ und „Programm“ werden immer angezeigt.</div>
          <div class="swlist">
            <label class="check sw"><input type="checkbox" id="fMood" ${t.moodColumn !== false ? 'checked' : ''}> Spalte 🙂☹️😉 ‚Wie war was?‘</label>
            <label class="check sw"><input type="checkbox" id="fFood" ${t.foodColumn ? 'checked' : ''}> Spalte 🍽️🍷☕️ ‚Essen und Trinken‘</label>
            <label class="check sw"><input type="checkbox" id="fQuarterCol" ${t.quarterColumn !== false ? 'checked' : ''}> Spalte 😴💤 ‚Quartier‘</label>
          </div>
          <div class="hint">Ausgeblendete Spalten fehlen in Tabelle, Tageserfassung und Ausgabe. Vorhandene Einträge bleiben erhalten.</div>
        </div>
        <div class="step">
          <div class="swlist" style="margin:0"><label class="check sw"><input type="checkbox" id="fQuarterList" ${t.quarterList ? 'checked' : ''}> Quartierliste in der Ausgabe</label></div>
          <div class="hint">Am Ende der Ausgabe: alle Quartiere mit Zeitraum, Anzahl Nächte und Maps-Link. Nur mit Spalte Quartier.</div>
        </div>
      </div>
    </form>`);

  const fTitle = dlg.querySelector('#fTitle');
  const fStart = dlg.querySelector('#fStart');
  const fEnd = dlg.querySelector('#fEnd');
  const warn = dlg.querySelector('#tripWarn');
  const ok = dlg.querySelector('#dlgOk');
  fitDate(fStart);
  fitDate(fEnd);

  // Pflichtfelder: Reisetitel, Reiseteilnehmer, Reisezeitraum, Reisemittel – ohne eigene Kennzeichnung.
  // Fehlermeldungen stehen in Rot unter dem jeweiligen Feld (Feld mit rotem Rahmen), aber erst nach einer Eingabe:
  // Titel/Teilnehmer, wenn das Feld leer verlassen oder geleert wurde; Zeitraum, sobald ein Datum geändert oder ein
  // Titel eingegeben wurde; Reisemittel, wenn das letzte abgewählt wurde. Ein Tippen auf das Häkchen zeigt alle
  // fehlenden Angaben und scrollt zur ersten; ohne Änderung schließt das Häkchen einfach.
  const fPeople = dlg.querySelector('#fPeople');
  const checks = {
    title: { box: dlg.querySelector('#titleWarn'), fields: [fTitle], touched: false,
      text: () => fTitle.value.trim() ? '' : 'Bitte einen Reisetitel eingeben.' },
    people: { box: dlg.querySelector('#peopleWarn'), fields: [fPeople], touched: false,
      text: () => fPeople.value.trim() ? '' : 'Bitte Reiseteilnehmer eingeben.' },
    dates: { box: warn, fields: [fStart, fEnd], touched: false, text: () => {
      if (!fStart.value || !fEnd.value) return 'Bitte Beginn und Ende der Reise wählen.';
      const other = overlappingTrip(fStart.value, fEnd.value, trip?.id);
      return other ? `Der Zeitraum überschneidet sich mit „${other.title}“ (${fullDate(other.start)} - ${fullDate(other.end)}). Bitte korrigieren.` : '';
    } },
    transport: { box: dlg.querySelector('#transportWarn'), fields: [], touched: false,
      text: () => transport.size ? '' : 'Bitte mindestens ein Reisemittel wählen.' },
  };
  let hadTitle = Boolean(fTitle.value.trim());
  const validate = () => {
    let valid = true;
    for (const [key, c] of Object.entries(checks)) {
      const text = c.text();
      if (text) valid = false;
      // Sobald ein Titel da ist, wird auch ein Problem beim Zeitraum gezeigt (z. B. Überschneidung durch das vorgeschlagene Datum).
      const on = Boolean(text) && (c.touched || (key === 'dates' && hadTitle));
      c.box.textContent = on ? text : '';
      c.box.hidden = !on;
      c.fields.forEach(f => f.classList.toggle('invalid', on));
    }
    return valid;
  };
  ok.addEventListener('click', ev => {
    if (!dlgDirty()) { ev.preventDefault(); dlg.close('cancel'); return; }
    if (validate()) return;
    ev.preventDefault();
    Object.values(checks).forEach(c => { c.touched = true; });
    validate();
    dlg.querySelector('.warn:not([hidden])')?.closest('.step').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  dlg.querySelectorAll('#transport button').forEach(b => b.onclick = () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    on ? transport.add(b.dataset.t) : transport.delete(b.dataset.t);
    if (!transport.size) checks.transport.touched = true;
    validate();
  });
  // Von und Bis gleichen sich an, damit das Ende nie vor dem Beginn liegt.
  const dateChanged = () => { checks.dates.touched = true; fitDate(fStart); fitDate(fEnd); validate(); };
  fStart.oninput = () => { if (fStart.value && fEnd.value < fStart.value) fEnd.value = fStart.value; dateChanged(); };
  fEnd.oninput = () => { if (fEnd.value && fStart.value > fEnd.value) fStart.value = fEnd.value; dateChanged(); };
  fTitle.oninput = () => { if (fTitle.value.trim()) hadTitle = true; else if (hadTitle) checks.title.touched = true; validate(); };
  fTitle.onblur = () => { checks.title.touched = true; validate(); };
  let hadPeople = Boolean(fPeople.value.trim());
  fPeople.oninput = () => { if (fPeople.value.trim()) hadPeople = true; else if (hadPeople) checks.people.touched = true; validate(); };
  fPeople.onblur = () => { checks.people.touched = true; validate(); };
  validate();

  // Quartierliste nur mit sichtbarer Spalte Quartier.
  const fQuarterCol = dlg.querySelector('#fQuarterCol');
  const fQuarterList = dlg.querySelector('#fQuarterList');
  const syncQuarterList = () => {
    fQuarterList.disabled = !fQuarterCol.checked;
    fQuarterList.closest('.step').classList.toggle('off', !fQuarterCol.checked);
  };
  fQuarterCol.onchange = syncQuarterList;
  syncQuarterList();

  // Geändert: Vergleich mit dem Stand beim Öffnen.
  const state = () => JSON.stringify([fTitle.value, fPeople.value, fStart.value, fEnd.value, [...transport].sort(),
    ...['#fMood', '#fFood', '#fQuarterCol', '#fQuarterList'].map(id => dlg.querySelector(id).checked)]);
  const initial = state();
  dlgDirty = () => state() !== initial;

  // x schließt; das Häkchen legt ein neues Reiselogbuch an bzw. übernimmt die Einstellungen.
  dlg.onclose = () => {
    if (dlg.returnValue !== 'ok' || !validate()) return render();
    const target = trip || { id: uid(), days: {}, fazit: '', kosten: null, outputCounter: 0 };
    target.title = fTitle.value.trim();
    target.participants = dlg.querySelector('#fPeople').value.trim();
    target.start = fStart.value;
    target.end = fEnd.value;
    target.transport = TRANSPORT.map(x => x.id).filter(id => transport.has(id));
    target.quarterList = dlg.querySelector('#fQuarterList').checked;
    target.foodColumn = dlg.querySelector('#fFood').checked;
    target.moodColumn = dlg.querySelector('#fMood').checked;
    target.quarterColumn = fQuarterCol.checked;
    if (isNew) db.trips.push(target);
    save();
    if (isNew) return showTrip(target.id);
    render();
  };
}

          </div>
        </div>
        <div class="step">
          <div class="step-head"><label for="fProgram"><span class="step-num">2</span>Programm</label>${micButton('fProgram')}</div>
          <div class="chips" id="suggest">
            ${PROGRAM_SUGGESTIONS.map((s, i) => `<button type="button" data-s="${i}">${esc(s.label)}</button>`).join('')}
          </div>
          <textarea id="fProgram" placeholder="Was habt ihr gemacht? Eine Zeile pro Punkt.">${esc(e.program || '')}</textarea>
        </div>
        <div class="step" ${c.mood ? '' : 'hidden'}>
          <div class="step-head"><label for="fComment"><span class="step-num">${c.mood ? nextNo() : ''}</span>Wie war was?</label>${micButton('fComment')}</div>
          <div class="emoji-row" id="moods"></div>
          <textarea id="fComment" placeholder="Smiley antippen, dann ein paar Worte dazu.">${esc(e.comment || '')}</textarea>
          <div class="hint">${MOOD_HINT}</div>
        </div>
        ${trip.foodColumn ? `<div class="step">
          <div class="step-head"><label for="fFoodText"><span class="step-num">${nextNo()}</span>Essen und Trinken</label><label class="check chip head-check"><input type="checkbox" id="noLink"> keinen Google-Maps Link</label>${micButton('fFoodText')}</div>
          <div class="emoji-row" id="foodMoods"></div>

          <div class="hint">Format: „🕛😋 Hard Rock Café – Steak war super“. Der Name wird zum Maps-Link (mit dem Ort des Quartiers). „keinen Google-Maps Link“ gilt für die Zeile, in der der Cursor steht (markiert mit ⊘).</div>
        </div>` : ''}

          <div class="hint" id="qHint"></div>
        </div>
        ${micHint()}
      </div>
    </form>`, true);

  const fProgram = dlg.querySelector('#fProgram');
  const fComment = dlg.querySelector('#fComment');
  const fQuarter = dlg.querySelector('#fQuarter');
  const fPlace = dlg.querySelector('#fPlace');
  const fSame = dlg.querySelector('#fSame');
  const qHint = dlg.querySelector('#qHint');
  const savedInfo = dlg.querySelector('#dlgSub');
  let own = { name: same ? '' : (e.quarter || ''), place: same ? '' : (e.place || '') };
  const fFood = dlg.querySelector('#fFoodText');
  let lastComment = e.comment || '';
  let lastFood = e.food || '';
  let lastSnapshot = JSON.stringify(original);

  // Schritt 1: Wetter
  dlg.querySelectorAll('#wx button').forEach(b => b.onclick = () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    on ? weather.add(b.dataset.w) : weather.delete(b.dataset.w);
  });

  // Schritt 2: Vorschläge als neue Zeile einfügen
  dlg.querySelectorAll('#suggest button').forEach(b => b.onclick = () => {
    insertAtCursor(fProgram, PROGRAM_SUGGESTIONS[b.dataset.s].text, true);
  });

  // Schritt 3: Smiley-Schnellauswahl
  mountMoodRow(dlg.querySelector('#moods'), fComment, () => { lastComment = fComment.value.trim(); });
  if (fFood) mountMoodRow(dlg.querySelector('#foodMoods'), fFood, () => { lastFood = fFood.value.trim(); }, 'food');
  if (fFood) {
    const noLink = dlg.querySelector('#noLink');
    const syncNoLink = () => {
      const v = fFood.value;
      const pos = fFood.selectionStart ?? v.length;
      noLink.checked = v.slice(v.lastIndexOf('\n', pos - 1) + 1).startsWith(NO_LINK);
    };
    ['keyup', 'click', 'input', 'focus', 'select'].forEach(ev => fFood.addEventListener(ev, syncNoLink));
    noLink.onchange = () => { toggleNoLink(fFood); syncNoLink(); };
    syncNoLink();
  }

  // Schritt 4: Quartier
  const fNoMap = dlg.querySelector('#fNoMap');
  let ownNoMap = fNoMap.checked;
  const updateQuarter = () => {
    const useSame = Boolean(fSame?.checked);
    fQuarter.disabled = fPlace.disabled = fNoMap.disabled = useSame;
    const q = useSame ? prev : { ...own, noMap: ownNoMap };
    fQuarter.value = q.name;
    fPlace.value = q.place;
    fNoMap.checked = Boolean(q.noMap);
    if (useSame && !prev.name) qHint.textContent = 'Am Vortag ist noch kein Quartier eingetragen.';
    else qHint.innerHTML = q.name && !q.noMap ? `<a href="${mapsUrl(q)}" target="_blank" rel="noopener" style="text-decoration:none">📍 In Google Maps prüfen</a>` : '';
  };
  fNoMap.onchange = () => { ownNoMap = fNoMap.checked; updateQuarter(); };
  fQuarter.oninput = () => { own.name = fQuarter.value; updateQuarter(); };
  fPlace.oninput = () => { own.place = fPlace.value; updateQuarter(); };
  if (fSame) fSame.onchange = updateQuarter;
  updateQuarter();

  const stopMic = mountMics();

  const collect = () => {
    const useSame = Boolean(fSame?.checked);
    const next = {
      weather: WEATHER.filter(w => weather.has(w)).join(''),
      program: fProgram.value.trim(),
      comment: fComment.value.trim(),
      sameQuarter: useSame,
      quarter: useSame ? '' : own.name.trim(),
      place: useSame ? '' : own.place.trim(),
      noMap: useSame ? false : ownNoMap,
      // Bei ausgeblendeter Essen-Spalte bleiben vorhandene Einträge erhalten.
      food: fFood ? fFood.value.trim() : (e.food || ''),
    };
    return (next.weather || next.program || next.comment || next.sameQuarter || next.quarter || next.place || next.food) ? next : null;
  };

  const persist = () => {
    const next = collect();
    const snapshot = JSON.stringify(next);
    if (snapshot === lastSnapshot) return;
    countMoods(lastComment, next?.comment || '');
    lastComment = next?.comment || '';
    countMoods(lastFood, next?.food || '', 'food');
    lastFood = next?.food || '';
    if (next) trip.days[iso] = next; else delete trip.days[iso];
    if (save()) {
      lastSnapshot = snapshot;
      savedInfo.textContent = `Automatisch gespeichert um ${nowStamp().time}`;
    }
  };

  const restore = () => {
    countMoods(lastComment, original?.comment || '');
    countMoods(lastFood, original?.food || '', 'food');
    if (original) trip.days[iso] = original; else delete trip.days[iso];
    save();
  };

  autosaveTimer = setInterval(persist, AUTOSAVE_MS);
  const initialDay = JSON.stringify(collect());
  dlgDirty = () => JSON.stringify(collect()) !== initialDay;

  dlg.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {
    stopMic();
    persist();
    render();
    openDayDialog(trip, days[idx + Number(b.dataset.nav)]);
  });
  dlg.onclose = () => {
    clearInterval(autosaveTimer);
    stopMic();
    if (dlg.returnValue === 'ok') persist(); else restore();
    render();
  };
}

function tripStats(trip) {
  const days = tripDays(trip);
  const rec = days.filter(d => isRecorded(trip, d));
  const quarters = new Set(rec.map(d => quarterOf(trip, d).name).filter(Boolean));
  // Varianten mit/ohne Emoji-Darstellungszeichen (z. B. ☹️ und ☹) zählen gemeinsam.
  const count = (list) => {
    const c = new Map();
    list.forEach(x => {
      const key = x.replace(/\uFE0F/g, '');
      const hit = c.get(key) || { shown: x, n: 0 };
      if (x.includes('\uFE0F')) hit.shown = x;
      hit.n++;
      c.set(key, hit);
    });
    return [...c.values()].sort((a, b) => b.n - a.n).map(h => [h.shown, h.n]);
  };
  const weather = count(rec.flatMap(d => graphemes(rawEntry(trip, d).weather)));
  const c = cols(trip);
  const moods = count([...(c.mood ? rec.map(d => rawEntry(trip, d).comment) : []), trip.fazit].flatMap(emojisIn));
  const fmt = list => list.map(([e, n]) => `${n}×${e}`).join(' · ') || '–';
  return [
    ['Reisetage', `${days.length}, davon erfasst ${rec.length}`],
    ...(c.quarter ? [['Quartiere', String(quarters.size)], ['Nächte', String(quarterStays(trip).reduce((n, st) => n + st.nights, 0))]] : []),
    ['Wetter', fmt(weather)],
    ['Smileys', fmt(moods)],
  ];
}

// Aufeinanderfolgende Nächte im selben Quartier werden zu einem Aufenthalt zusammengefasst.
function quarterStays(trip) {
  const stays = [];
  for (const d of tripDays(trip)) {
    const q = quarterOf(trip, d);
    if (!q.name) continue;
    const last = stays[stays.length - 1];
    if (last && last.q.name === q.name && last.lastNight === addDays(d, -1)) {
      last.lastNight = d;
      last.nights++;
    } else {
      stays.push({ q, firstNight: d, lastNight: d, nights: 1 });
    }
  }
  return stays;
}

// Inhalt der Ausgabe: nur erfasste Tage, ohne Wetter-Platzhalter.
function outputBody(trip, version, stamp) {
  const c = cols(trip);
  const rows = tripDays(trip).filter(iso => isRecorded(trip, iso)).map(iso => {
    const e = rawEntry(trip, iso);
    const q = quarterOf(trip, iso);
    return `<tr>
      <td class="nw">${dayLabel(iso)}${e.weather ? `<br>${esc(e.weather)}` : ''}</td>
      <td>${linesHtml(programItems(e.program))}</td>
      ${c.mood ? `<td>${linesHtml(commentItems(e.comment))}</td>` : ''}
      ${c.food ? `<td>${foodHtml(foodItems(e.food, q.place))}</td>` : ''}
      ${c.quarter ? `<td>${quarterHtml(q)}</td>` : ''}
    </tr>`;
  }).join('');
  const transport = transportText(trip);
  const stays = trip.quarterList && c.quarter ? quarterStays(trip) : [];
  return `<div class="rt">
    <h1>Reiselogbuch – ${esc(trip.title)}</h1>
    <table class="meta">
      <tr><td><b>Reiseteilnehmer:</b></td><td>${esc(trip.participants)}</td></tr>
      <tr><td><b>Reisezeitraum:</b></td><td>${fullDate(trip.start)} - ${fullDate(trip.end)}</td></tr>
      ${transport ? `<tr><td><b>Reisemittel:</b></td><td>${esc(transport)}</td></tr>` : ''}
    </table>
    <table class="grid">
      <thead><tr>${headCells(trip)}</tr></thead>
      <tbody>${rows || `<tr><td colspan="${colCount(trip)}">Noch keine Tage erfasst.</td></tr>`}</tbody>
    </table>
    <h2>Fazit</h2>
    <div>${linesHtml(commentItems(trip.fazit))}</div>
    <h2>Gesamtkosten</h2>
    <p>${formatEuro(trip.kosten)}</p>
    ${stays.length ? `
      <h2>Quartierliste</h2>
      <table class="grid fit">
        <thead><tr><th>Quartier</th><th>Zeitraum</th><th class="num">Nächte</th></tr></thead>
        <tbody>${stays.map(s => `<tr>
          <td>${quarterHtml(s.q)}</td>
          <td class="nw">${shortDate(s.firstNight)} - ${fullDate(addDays(s.lastNight, 1))}</td>
          <td class="num">${s.nights}</td>
        </tr>`).join('')}</tbody>
      </table>` : ''}
    <h2>Statistik</h2>
    <table class="stats">
      ${tripStats(trip).map(([k, v]) => `<tr><td><b>${k}:</b></td><td>${esc(v)}</td></tr>`).join('')}
    </table>
    <p class="created">Ausgabe V${pad(version, 3)} erstellt am ${stamp.date} um ${stamp.time}</p>
  </div>`;
}

async function exportHtml(trip) {

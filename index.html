// PDF über das Drucken-Menü; der Seitentitel wird als Dateiname vorgeschlagen.
function exportPdf(trip) {
  const { version, stamp } = nextOutput(trip);
  const name = outputName(trip, version);
  dlgOpener = '#shareBtn';
  showOutputResult(`Ausgabe V${pad(version, 3)}`, name + '.pdf', 'print');
  const oldTitle = document.title;
  printout.innerHTML = `<style>${OUTPUT_CSS.replace(/\bbody\b/g, '#printout')}</style>${outputBody(trip, version, stamp)}`;
  document.title = name;
  const restore = () => { document.title = oldTitle; window.removeEventListener('afterprint', restore); };
  dlg.addEventListener('close', () => { printout.innerHTML = ''; }, { once: true });
  window.addEventListener('afterprint', restore);
  dlg.addEventListener('close', restore, { once: true });
  setTimeout(() => window.print(), 50);
}

const RESULT_TEXT = {
  shared: name => `Teilen-Menü abgeschlossen für <b>${esc(name)}</b>.<div class="hint">Wenn du „In Dateien sichern“ gewählt hast, liegt die Datei im gewählten Ordner.</div>`,
  downloaded: name => `Download von <b>${esc(name)}</b> angestoßen.<div class="hint">Bitte in der Dateien-App unter „Downloads“ prüfen.</div>`,
  aborted: name => `Teilen-Menü abgebrochen – <b>${esc(name)}</b> wurde nicht gespeichert.`,
  error: name => `<b>${esc(name)}</b> konnte nicht übergeben werden.`,
  print: name => `Drucken-Menü geöffnet für <b>${esc(name)}</b>.<div class="hint">Dort über „Teilen“ → „In Dateien sichern“ als PDF ablegen.</div>`,
};

function showOutputResult(title, name, result) {
  const remind = !backedUpToday() && result !== 'aborted' && result !== 'error';
  openDialog(`
    <form method="dialog">
      ${dlgHead(esc(title), { check: false })}
      <div class="dlg-body">
        <div class="step">${result === 'aborted' || result === 'error' ? '⚠️' : '✅'} ${RESULT_TEXT[result](name)}</div>
        ${remind ? backupReminderHtml() : ''}
      </div>
    </form>`);
  bindBackupReminder();
}

function backupReminderHtml() {
  return `<div class="step" id="reminder">
      <strong>💾 Denk daran, auch ein Backup zu erstellen.</strong>
      <div class="hint">${lastBackupText()}</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button type="button" class="primary" id="backupNow">${ic('save')}Backup erstellen</button>
      </div>
    </div>`;
}

function bindBackupReminder() {
  const btn = dlg.querySelector('#backupNow');
  if (!btn) return;
  btn.onclick = async () => {
    const name = await saveBackup();
    const box = dlg.querySelector('#reminder');
    if (box && name) box.innerHTML = name;
  };
}

// Erstellt das Backup über das Teilen-Menü; der Zeitpunkt zählt nur, wenn das Menü abgeschlossen wurde.
// anchor: Schaltfläche, von der es kommt – sie bleibt bis zum Schließen der Meldung blau.
async function saveBackup(anchor) {
  hold(anchor);
  const file = backupFile();
  const result = await shareFiles([file]);
  if (result === 'shared' || result === 'downloaded') {
    db.settings.lastBackup = Date.now();
    save();
    renderSide();
  }
  const text = `${result === 'aborted' || result === 'error' ? '⚠️' : '✅'} ${RESULT_TEXT[result](file.name)}`;
  if (!dlg.querySelector('#reminder')) await inform('Backup', text);
  release(anchor);
  return text;
}

const MIME = { json: 'application/json', html: 'text/html' };

async function shareFiles(files) {
  const list = files.map(f => new File([f.content], f.name, { type: MIME[f.type] || 'application/octet-stream' }));
  if (navigator.canShare && navigator.canShare({ files: list })) {
    try {
      await navigator.share({ files: list });
      return 'shared';
    } catch (e) {
      return e.name === 'AbortError' ? 'aborted' : 'error';
    }
  }
  files.forEach(f => downloadFile(f.name, f.content, MIME[f.type]));
  return 'downloaded';
}

function downloadFile(name, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ---------- Backup ---------- */

importFile.addEventListener('cancel', () => release('#sideMore'));
importFile.onchange = async () => {
  const file = importFile.files[0];
  importFile.value = '';
  if (!file) return release('#sideMore');
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.trips)) throw new Error('Kein Reiselogbuch-Backup.');
    const n = data.trips.length;
    const yes = await confirmPop(side.querySelector('#sideMore'),
      `Backup mit ${n} Reiselogbu${n === 1 ? 'ch' : 'chern'} laden? Die aktuellen Daten auf diesem iPad werden ersetzt.`,
      { label: 'Ersetzen', icon: 'folder-open' });
    if (!yes) return release('#sideMore');
    release('#sideMore');
    db = normalize(data);
    save();
    applyTheme();
    if (dlg.open) dlg.close();
    showTrip(pickStartTrip()?.id);
  } catch (e) {
    await inform('Backup laden', 'Die Datei konnte nicht gelesen werden: ' + esc(e.message));
    release('#sideMore');
  }
};

/* ---------- Start ---------- */

applyTheme();
// Beim Start ist die Seitenleiste immer eingeblendet (im Hochformat über den Inhalt gelegt).
db.settings.sidebar = true;
sideOverlay = !isWide();
showTrip(pickStartTrip()?.id);
// Wechsel quer/hoch: Seitenleiste fest oder darübergelegt; sonst nur Höhen und Breiten nachführen.
let wasWide = isWide();
window.addEventListener('resize', () => {
  if (isWide() !== wasWide) { wasWide = isWide(); sideOverlay = false; render(); return; }
  const bar = document.getElementById('bar');
  if (bar) document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px');
  if (!side.hidden) document.documentElement.style.setProperty('--side-w', side.offsetWidth + 'px');
});
// Bei offener Tastatur verschiebt Safari den sichtbaren Bereich; Kopfzeile und Tabellenkopf wandern mit.
if (window.visualViewport) {
  const vvTop = () => document.documentElement.style.setProperty('--vv-top', Math.max(0, visualViewport.offsetTop) + 'px');
  visualViewport.addEventListener('scroll', vvTop);
  visualViewport.addEventListener('resize', vvTop);
}
// Beim Scrollen bekommt die Kopfzeile eine Haarlinie.
window.addEventListener('scroll', () => document.getElementById('bar')?.classList.toggle('line', scrollY > 4), { passive: true });

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
}
</script>

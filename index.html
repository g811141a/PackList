<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reiselogbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f3ee">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Reiselogbuch</title>
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --ink: #22201c;
    --muted: #8a847a;
    --line: #e2ddd4;
    --accent: #2f6f62;
    --accent-ink: #ffffff;
    --danger: #b3261e;
    --warn: #c07a12;
    --focus: #fff1c2;
    --row-hover: #ebe7e0;
    --th-bg: #d9d9d9;
    --th-line: #a5a5a5;
    --zebra: #f5f5f5;
    --bar-h: 64px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a18; --card: #252421; --ink: #ece8e1; --muted: #9a9489; --line: #3a3833;
      --accent: #6fbfa9; --accent-ink: #10201c; --danger: #f2948c; --warn: #e2a64b;
      --focus: #45391a; --row-hover: #34322e; color-scheme: dark;
      --th-bg: #3b3a37; --th-line: #625f5a; --zebra: #2e2d2a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a18; --card: #252421; --ink: #ece8e1; --muted: #9a9489; --line: #3a3833;
    --accent: #6fbfa9; --accent-ink: #10201c; --danger: #f2948c; --warn: #e2a64b;
    --focus: #45391a; --row-hover: #34322e; color-scheme: dark;
    --th-bg: #3b3a37; --th-line: #625f5a; --zebra: #2e2d2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 0 max(16px, env(safe-area-inset-right)) 100px max(16px, env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 28px; margin: 12px 0 6px; }
  h2 { font-size: 20px; margin: 28px 0 8px; }
  a { color: var(--accent); }
  button, input, textarea { font: inherit; color: inherit; }
  button {
    border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 8px 12px; cursor: pointer; min-height: 44px;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.link { border: none; background: none; color: var(--accent); padding: 6px 8px; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button.primary.danger { background: var(--danger); color: #fff; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  input[type=text], input[type=search], input[type=date], input[type=number], textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--card);
    padding: 10px 12px; min-height: 44px;
  }
  input:disabled { opacity: .6; }
  textarea { resize: vertical; min-height: 96px; }
  label { display: block; font-weight: 600; margin: 0 0 6px; }
  .muted { color: var(--muted); }
  .spacer { flex: 1; }

  /* Fixierte Aktionsleiste */
  .bar {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: calc(env(safe-area-inset-top) + 10px) 0 10px; border-bottom: 1px solid var(--line);
  }
  .bar input[type=search] { width: 200px; flex: 0 1 200px; }
  .bar .hits { font-size: 14px; }

  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 4px 0 6px; }
  .meta dt { font-weight: 600; }
  .meta dd { margin: 0; }
  .progress { font-size: 14px; color: var(--muted); margin: 0 0 12px; }

  /* Tabelle */
  .table-wrap { background: var(--card); border: 1px solid var(--th-line); border-radius: 12px; overflow: clip; }
  table.days { border-collapse: separate; border-spacing: 0; width: 100%; }
  table.days th, table.days td { border-bottom: 1px solid var(--line); padding: 10px 12px; vertical-align: top; text-align: left; }
  table.days td + td { border-left: 1px solid var(--line); }
  table.days th { position: sticky; top: var(--bar-h); background: var(--th-bg); border-bottom-color: var(--th-line); font-size: 15px; z-index: 2; }
  table.days th + th { border-left: 1px solid var(--th-line); }
  table.days tbody tr:last-child td { border-bottom: none; }
  table.days tbody tr { cursor: pointer; }
  table.days tbody tr.alt { background: var(--zebra); }
  @media (hover: hover) { table.days tbody tr:hover { background: var(--row-hover); } }
  table.days tbody tr.gap { background: var(--focus); box-shadow: inset 4px 0 0 var(--accent); }
  td.day { white-space: nowrap; width: 1%; }
  td.day .wx { display: block; font-size: 18px; }
  td.day .wx.empty { opacity: .25; }
  .tag { display: inline-block; font-size: 12px; border-radius: 6px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
  .tag.today { background: var(--accent); color: var(--accent-ink); }
  .tag.miss { color: var(--warn); border: 1px solid var(--warn); }
  td.quarter a { text-decoration: none; }
  .empty-note { padding: 20px; text-align: center; color: var(--muted); }

  /* Hängender Einzug: Folgezeilen beginnen unter dem Text, nicht unter dem Zeichen */
  .ln { display: flex; gap: .35em; }
  .ln + .ln { margin-top: 2px; }
  .ln .m { flex: none; }
  .ln .t { min-width: 0; overflow-wrap: anywhere; }
  mark { background: #ffe45c; color: inherit; border-radius: 3px; padding: 0 1px; }
  :root[data-theme="dark"] mark { background: #8a6d00; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) mark { background: #8a6d00; } }

  .fazit-box { display: inline-block; width: auto; max-width: 100%; text-align: left; padding: 12px 14px; min-height: 60px; border-radius: 12px; }
  .trip-row { display: flex; gap: 8px; margin-top: 10px; }
  .trip-row .choice { margin: 0; flex: 1; }
  .trip-row .edit { width: 56px; font-size: 20px; flex: none; }
  #msg { width: min(480px, 100vw - 32px); }
  .msg-text { padding: 8px 2px; }
  .kosten { display: flex; align-items: center; gap: 10px; }
  .kosten span { font-size: 20px; }
  #kosten { text-align: right; width: 96px; flex: none; }
  .table-wrap.fit { display: inline-block; max-width: 100%; }
  .table-wrap.fit table { width: auto; }
  table.days.static th { position: static; }
  table.days.static tbody tr { cursor: default; }
  table.days td.num, table.days th.num { text-align: right; }
  table.days td.nw { white-space: nowrap; }
  table.days.static td.quarter a, table.days.static a { text-decoration: none; }
  td a { text-decoration: none; }

  .fab { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; z-index: 4; }
  .fab button { width: 48px; padding: 0; font-size: 20px; }

  /* Dialoge */
  dialog {
    border: none; border-radius: 18px; padding: 0; width: min(720px, 100vw - 24px);
    max-height: calc(100vh - 40px); background: var(--bg); color: var(--ink);
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog form { display: flex; flex-direction: column; max-height: calc(100vh - 40px); }
  .dlg-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .dlg-head h3 { margin: 0; flex: 1; text-align: center; font-size: 19px; min-height: 28px; line-height: 28px; }
  .dlg-body { padding: 8px 16px 20px; overflow-y: auto; flex: 1; }
  .dlg-foot { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
  .step { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
  .step-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .step-head label { margin: 0; flex: 1; }
  .step-num {
    display: inline-flex; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    align-items: center; justify-content: center; font-size: 14px; margin-right: 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chips button { font-size: 15px; padding: 6px 10px; min-height: 38px; }
  .emoji-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .emoji-row button {
    font-size: 24px; padding: 4px 8px; min-width: 48px;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  .emoji-row button.reset { font-size: 20px; color: var(--muted); }
  .mic { font-size: 18px; padding: 4px 10px; min-height: 38px; }
  .mic[aria-pressed="true"] { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  .hint { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .warn { font-size: 15px; color: var(--danger); margin-top: 10px; }
  .check { display: flex; align-items: center; gap: 10px; font-weight: 400; margin: 0 0 10px; min-height: 44px; cursor: pointer; }
  .check input { width: 24px; height: 24px; accent-color: var(--accent); }
  .choice { display: block; width: 100%; text-align: left; margin-top: 10px; padding: 14px 16px; }
  .choice strong { display: block; font-size: 18px; }
  .choice.current { border-color: var(--accent); border-width: 2px; }
  .saved { font-size: 13px; color: var(--muted); }

  #printout { display: none; }
  @media print {
    @page { size: A4 landscape; margin: 12mm; }
    html, body { background: #fff !important; color: #000; padding: 0; }
    #app, dialog, .fab { display: none !important; }
    #printout { display: block; }
  }
</style>
</head>
<body>
<main id="app"></main>
<div class="fab" id="fab" hidden>
  <button id="toTop" aria-label="Nach oben">⬆️</button>
  <button id="toEnd" aria-label="Ans Ende">⬇️</button>
</div>
<div id="printout"></div>
<dialog id="dlg"></dialog>
<dialog id="msg"></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';

const app = document.getElementById('app');
const dlg = document.getElementById('dlg');
const msg = document.getElementById('msg');
const fab = document.getElementById('fab');
const printout = document.getElementById('printout');
const importFile = document.getElementById('importFile');

const STORAGE_KEY = 'reiselogbuch.v1';
const OLD_STORAGE_KEY = 'reisetagebuch.v1'; // Name vor der Umbenennung, wird beim ersten Start übernommen
const WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const WEEKDAYS_LONG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const WEATHER = ['☀️', '🌤', '🌦', '🌧', '☁️', '⛈', '❄️'];
const TRANSPORT = [
  { id: 'pkw', icon: '🚗', name: 'PKW' },
  { id: 'zug', icon: '🚆', name: 'Zug' },
  { id: 'rad', icon: '🚲', name: 'Fahrrad' },
  { id: 'flug', icon: '✈️', name: 'Flugzeug' },
  { id: 'leihwagen', icon: '🚙', name: 'Leihwagen' },
  { id: 'schiff', icon: '🚢', name: 'Schiff' },
  { id: 'wohnmobil', icon: '🚐', name: 'Wohnmobil' },
  { id: 'fuss', icon: '🚶', name: 'Fuß' },
];
const DEFAULT_MOODS = ['🙂', '😊', '😉', '👍', '😋', '😌', '😏', '😳', '🤪', '🥶', '🤷🏻‍♂️', '☹️', '🤮'];
const DEFAULT_FOOD = ['🕗', '🕙', '🕛', '🕒', '🕕', '😋', '👌', '👍', '😕', '🤮', '👎', '⭐️', '🍕', '🍔', '🥩', '🍷', '🍺', '☕️'];
// Zwei getrennte Schnellauswahl-Leisten: Stimmung (Wie war's?/Fazit) und Essen.
const EMOJI_SETS = {
  mood: { defaults: DEFAULT_MOODS, usage: 'moodUsage', hidden: 'hiddenMoods' },
  food: { defaults: DEFAULT_FOOD, usage: 'foodUsage', hidden: 'hiddenFood' },
};
const PROGRAM_SUGGESTIONS = [
  { label: 'Weiterfahrt nach …', text: 'Weiterfahrt nach ' },
  { label: 'Rundgang durch …', text: 'Rundgang durch ' },
  { label: 'Besichtigung …', text: 'Besichtigung ' },
  { label: 'Freetour …', text: 'Freetour ' },
];
const AUTOSAVE_MS = 10000;
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

/* ---------- Speicher ---------- */

function normalize(data) {
  data.trips ||= [];
  data.moodUsage ||= {};
  data.hiddenMoods ||= [];
  data.foodUsage ||= {};
  data.hiddenFood ||= [];
  data.settings = { theme: 'auto', hideEmpty: false, ...(data.settings || {}) };
  for (const t of data.trips) {
    t.days ||= {};
    t.transport ||= [];
    t.quarterList ??= false;
    t.foodColumn ??= false;
    t.outputCounter ||= 0;
  }
  return data;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) ?? localStorage.getItem(OLD_STORAGE_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { /* leer starten */ }
  return normalize({});
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    return true;
  } catch (e) {
    inform('Speichern fehlgeschlagen', 'Der Speicher ist voll oder nicht verfügbar. Bitte ein Backup sichern.');
    return false;
  }
}

let db = load();
let currentTripId = null;
let searchTerm = '';
let autosaveTimer = null;

/* ---------- Datum ---------- */

// Datumsangaben immer als 'YYYY-MM-DD', gerechnet in UTC, damit die Sommerzeit nicht stört.
function parseISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function toISO(date) { return date.toISOString().slice(0, 10); }
function todayISO() {
  const n = new Date();
  return toISO(new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())));
}
function addDays(iso, n) {
  const d = parseISO(iso);
  d.setUTCDate(d.getUTCDate() + n);
  return toISO(d);
}
const pad = (n, len = 2) => String(n).padStart(len, '0');
function dayLabel(iso) {
  const d = parseISO(iso);
  return `${WEEKDAYS[d.getUTCDay()]}, ${pad(d.getUTCDate())}.${pad(d.getUTCMonth() + 1)}.`;
}
function longDayLabel(iso) {
  return `${WEEKDAYS_LONG[parseISO(iso).getUTCDay()]}, ${fullDate(iso)}`;
}
function fullDate(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function shortDate(iso) {
  const [, m, d] = iso.split('-');
  return `${d}.${m}.`;
}
function tripDays(trip) {
  const days = [];
  if (!trip.start || !trip.end || trip.end < trip.start) return days;
  for (let d = trip.start; d <= trip.end; d = addDays(d, 1)) days.push(d);
  return days;
}
function nowStamp() {
  const n = new Date();
  return {
    date: `${pad(n.getDate())}.${pad(n.getMonth() + 1)}.${n.getFullYear()}`,
    time: `${pad(n.getHours())}:${pad(n.getMinutes())}`,
    file: `${n.getFullYear()}.${pad(n.getMonth() + 1)}.${pad(n.getDate())} ${pad(n.getHours())}.${pad(n.getMinutes())}`,
  };
}

/* ---------- Reisen ---------- */

const getTrip = id => db.trips.find(t => t.id === id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// Startreise: die Reise, in die heute fällt; sonst die zuletzt beendete; sonst die nächste geplante.
function pickStartTrip() {
  const today = todayISO();
  const current = db.trips.find(t => t.start <= today && today <= t.end);
  if (current) return current;
  const ended = db.trips.filter(t => t.end < today).sort((a, b) => b.end.localeCompare(a.end));
  if (ended.length) return ended[0];
  const planned = db.trips.filter(t => t.start > today).sort((a, b) => a.start.localeCompare(b.start));
  return planned[0] || null;
}

function overlappingTrip(start, end, ignoreId) {
  return db.trips.find(t => t.id !== ignoreId && start <= t.end && t.start <= end);
}

function transportText(trip) {
  return TRANSPORT.filter(t => trip.transport.includes(t.id)).map(t => `${t.icon} ${t.name}`).join(', ');
}

/* ---------- Tage ---------- */

function rawEntry(trip, iso) { return trip.days[iso] || {}; }

// Quartier (Name + Ort) eines Tages; mit Häkchen "wie Vortag" wird es vom Vortag übernommen, auch über mehrere Tage.
function quarterOf(trip, iso) {
  for (let d = iso, i = 0; i < 1000; d = addDays(d, -1), i++) {
    const e = rawEntry(trip, d);
    if (!e.sameQuarter) return { name: e.quarter || '', place: e.place || '' };
    if (d <= trip.start) break;
  }
  return { name: '', place: '' };
}

function isRecorded(trip, iso) {
  const e = rawEntry(trip, iso);
  return Boolean(e.weather || e.program || e.comment || quarterOf(trip, iso).name);
}

function firstGap(trip) {
  return tripDays(trip).find(d => !isRecorded(trip, d)) || null;
}

function matchesSearch(trip, iso, term) {
  const e = rawEntry(trip, iso);
  const q = quarterOf(trip, iso);
  return [e.program, e.comment, e.food, q.name, q.place].join('\n').toLocaleLowerCase('de').includes(term);
}

/* ---------- Text-Formatierung mit hängendem Einzug ---------- */

const segmenter = new Intl.Segmenter();
const EMOJI_RE = /\p{Extended_Pictographic}/u;
const graphemes = text => Array.from(segmenter.segment(text || ''), s => s.segment);

function emojisIn(text) {
  return graphemes(text).filter(s => EMOJI_RE.test(s));
}

function splitLines(text) {
  return (text || '').split('\n').map(l => l.trim()).filter(Boolean);
}

// Programm: bei mehreren Zeilen jede mit ▫️, bei einer Zeile ohne Zeichen.
function programItems(text) {
  const lines = splitLines(text).map(l => l.replace(/^(▫️|▫|-|•)\s*/u, ''));
  return lines.map(t => ({ m: lines.length > 1 ? '▫️' : '', t }));
}

// Führende Smileys (auch mehrere) einer Zeile abtrennen: "🕛 😋 Text" → { m: "🕛😋", t: "Text" }.
function splitLeadingEmojis(line) {
  const g = graphemes(line);
  const marks = [];
  let i = 0;
  while (i < g.length && (EMOJI_RE.test(g[i]) || /^\s+$/.test(g[i]))) {
    if (EMOJI_RE.test(g[i])) marks.push(g[i]);
    i++;
  }
  const rest = g.slice(i).join('').trim();
  return marks.length && rest ? { m: marks.join(''), t: rest } : { m: '', t: line };
}

// Kommentar: führende Smileys werden zum Zeichen, der Text rückt daneben ein.
function commentItems(text) {
  return splitLines(text).map(splitLeadingEmojis);
}

// Trennt den Namen vom Rest: am ersten " - " (bzw. – —), optional auch am ersten Komma.
// "Santai Resort - Kingscliff" → ["Santai Resort", " - Kingscliff"]
function splitName(text, withComma) {
  const m = text.match(withComma ? /\s+[–—-]\s+|\s*,/ : /\s+[–—-]\s+/);
  if (!m || m.index === 0) return [text, ''];
  return [text.slice(0, m.index), text.slice(m.index)];
}

const linkAttrs = inApp => inApp ? ' target="_blank" rel="noopener" onclick="event.stopPropagation()"' : '';

// Quartier: 📍 und Hotelname sind der Link, Ort danach ist normaler Text; gesucht wird mit dem ganzen Eintrag.
function quarterHtml(q, term = '', inApp = false) {
  if (!q.name) return '';
  const [name, rest] = splitName(q.name, true);
  const url = mapsUrl(q);
  const at = linkAttrs(inApp);
  return `<div class="ln"><a class="m pin" href="${url}"${at}>📍</a><span class="t"><a href="${url}"${at}>${highlight(name, term)}</a>${highlight(rest, term)}</span></div>`;
}

// Essen: "Smileys Name – Kommentar"; 📍 und Name sind der Link (Suche: Name + Ort des Quartiers).
function foodItems(text, place) {
  return splitLines(text).map(line => {
    const { m, t } = splitLeadingEmojis(line);
    const [name, rest] = splitName(t, false);
    return { m, name, rest, maps: name.trim() ? mapsUrl({ name, place }) : '' };
  });
}

function foodHtml(items, term = '', inApp = false) {
  return items.map(({ m, name, rest, maps }) =>
    `<div class="ln">${m ? `<span class="m">${esc(m)}</span>` : ''}<span class="t">${maps
      ? `<a class="pin" href="${maps}"${linkAttrs(inApp)}>📍${highlight(name, term)}</a>${highlight(rest, term)}`
      : highlight(name + rest, term)}</span></div>`).join('');
}

// Optional werden Suchtreffer im (bereits maskierten) Text gelb markiert.
function highlight(text, term) {
  const safe = esc(text);
  if (!term) return safe;
  const pattern = esc(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(pattern, 'gi'), m => `<mark>${m}</mark>`);
}

function linesHtml(items, term = '') {
  return items.map(({ m, t }) =>
    `<div class="ln">${m ? `<span class="m">${esc(m)}</span>` : ''}<span class="t">${highlight(t, term)}</span></div>`).join('');
}

/* ---------- Smileys ---------- */

// Nach Häufigkeit sortiert, noch nie benutzte in Standardreihenfolge dahinter; entfernte ausgeblendet.
function quickMoods(kind = 'mood') {
  const set = EMOJI_SETS[kind];
  const usage = db[set.usage];
  const hidden = new Set(db[set.hidden]);
  const order = m => { const i = set.defaults.indexOf(m); return i < 0 ? 999 : i; };
  const all = [...new Set([...Object.keys(usage), ...set.defaults])].filter(m => !hidden.has(m));
  return all
    .filter(m => set.defaults.includes(m) || usage[m] > 0)
    .sort((a, b) => (usage[b] || 0) - (usage[a] || 0) || order(a) - order(b));
}

// Zähler an die Änderung eines Kommentars anpassen; wieder verwendete Smileys kommen zurück.
function countMoods(before, after, kind = 'mood') {
  const set = EMOJI_SETS[kind];
  const usage = db[set.usage];
  const diff = {};
  emojisIn(after).forEach(m => diff[m] = (diff[m] || 0) + 1);
  emojisIn(before).forEach(m => diff[m] = (diff[m] || 0) - 1);
  for (const [m, n] of Object.entries(diff)) {
    if (!n) continue;
    usage[m] = Math.max(0, (usage[m] || 0) + n);
    if (!usage[m]) delete usage[m];
    if (n > 0) db[set.hidden] = db[set.hidden].filter(h => h !== m);
  }
}

/* ---------- Hilfen ---------- */

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function mapsUrl({ name, place }) {
  const query = [name, place].map(s => (s || '').trim()).filter(Boolean).join(', ');
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
}
// Ganze Zahl mit Tausenderpunkt, z. B. 4850 → "4.850".
function thousands(n) {
  return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function formatEuro(value) {
  return '€ ' + thousands(value) + ',-';
}

function insertAtCursor(ta, text, ownLine) {
  const v = ta.value;
  const pos = ta.selectionStart ?? v.length;
  const before = v.slice(0, pos);
  const prefix = ownLine && before && !before.endsWith('\n') ? '\n' : '';
  const ins = prefix + text;
  ta.value = before + ins + v.slice(pos);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = pos + ins.length;
}

function insertEmoji(ta, emoji) {
  const v = ta.value;
  const pos = ta.selectionStart ?? v.length;
  const lineStart = v.lastIndexOf('\n', pos - 1) + 1;
  const head = v.slice(lineStart, pos);
  const onlyEmojis = graphemes(head).every(g => EMOJI_RE.test(g) || /^\s+$/.test(g));
  let before, ins;
  if (onlyEmojis) {
    before = v.slice(0, lineStart) + head.trimEnd();
    ins = emoji + ' ';
  } else {
    before = v.slice(0, pos);
    ins = '\n' + emoji + ' ';
  }
  ta.value = before + ins + v.slice(pos);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = before.length + ins.length;
}

function onLongPress(btn, onLong, onTap) {
  let timer = null;
  let fired = false;
  btn.addEventListener('pointerdown', () => {
    fired = false;
    timer = setTimeout(() => { fired = true; onLong(); }, 600);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, () => clearTimeout(timer)));
  btn.addEventListener('contextmenu', e => e.preventDefault());
  btn.addEventListener('click', e => {
    e.preventDefault();
    if (fired) { fired = false; return; }
    onTap();
  });
}

/* ---------- Darstellung ---------- */

const THEMES = { auto: { icon: '🌓', label: 'Automatisch' }, light: { icon: '☀️', label: 'Hell' }, dark: { icon: '🌙', label: 'Dunkel' } };

function applyTheme() {
  const t = db.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}

function cycleTheme() {
  const order = ['auto', 'light', 'dark'];
  db.settings.theme = order[(order.indexOf(db.settings.theme) + 1) % order.length];
  save();
  applyTheme();
  render();
}

/* ---------- Hauptansicht ---------- */

function render({ scrollToGap = false } = {}) {
  const trip = getTrip(currentTripId);
  if (!trip) return renderEmpty();
  const today = todayISO();
  const days = tripDays(trip);
  const gap = firstGap(trip);
  const term = searchTerm.trim().toLocaleLowerCase('de');
  const recorded = days.filter(d => isRecorded(trip, d)).length;

  const visible = days.filter(iso => {
    if (term) return matchesSearch(trip, iso, term);
    return !db.settings.hideEmpty || isRecorded(trip, iso);
  });

  // Zebrastreifen nach sichtbaren Zeilen, damit das Muster auch bei Filter und Suche abwechselt.
  const rows = visible.map((iso, i) => {
    const e = rawEntry(trip, iso);
    const q = quarterOf(trip, iso);
    const rec = isRecorded(trip, iso);
    const tags = (iso === today ? '<span class="tag today">heute</span>' : '')
      + (!rec && iso < today ? '<span class="tag miss">fehlt</span>' : '');
    const wx = e.weather
      ? `<span class="wx">${esc(e.weather)}</span>`
      : `<span class="wx empty">☀️🌤🌦🌧</span>`;
    const link = quarterHtml(q, term, true);
    const cls = [i % 2 ? 'alt' : '', iso === gap ? 'gap' : ''].join(' ').trim();
    return `<tr data-day="${iso}" class="${cls}">
      <td class="day">${dayLabel(iso)}${tags}${wx}</td>
      <td>${linesHtml(programItems(e.program), term)}</td>
      <td>${linesHtml(commentItems(e.comment), term)}</td>
      ${trip.foodColumn ? `<td>${foodHtml(foodItems(e.food, q.place), term, true)}</td>` : ''}
      <td class="quarter">${link}</td>
    </tr>`;
  }).join('');

  let progress;
  if (today < trip.start) progress = `Reise beginnt in ${Math.round((parseISO(trip.start) - parseISO(today)) / 864e5)} Tagen`;
  else if (today > trip.end) progress = `Reise beendet · ${days.length} Tage`;
  else progress = `Tag ${days.indexOf(today) + 1} von ${days.length}`;
  progress += ` · ${recorded} erfasst`;

  const theme = THEMES[db.settings.theme];
  const transport = transportText(trip);
  const stays = quarterStays(trip);

  app.innerHTML = `
    <div class="bar" id="bar">
      <button id="trips">🧳 Reiselogbücher</button>
      <span class="spacer"></span>
      <button id="toggleEmpty">${db.settings.hideEmpty ? '⤵️ Leere Tage ein' : '⤴️ Leere Tage aus'}</button>
      <button id="theme" title="Darstellung: ${theme.label}" aria-label="Darstellung: ${theme.label}">${theme.icon}</button>
      <button class="primary" id="output">📤 Ausgabe</button>
      <input type="search" id="search" placeholder="🔎 Suchen" value="${esc(searchTerm)}" autocomplete="off">
      ${term ? `<span class="hits muted">${visible.length} Treffer</span>` : ''}
    </div>
    <h1>Reiselogbuch – ${esc(trip.title)}</h1>
    <dl class="meta">
      <dt>Reiseteilnehmer:</dt><dd>${esc(trip.participants)}</dd>
      <dt>Reisezeitraum:</dt><dd>${fullDate(trip.start)} - ${fullDate(trip.end)}</dd>
      ${transport ? `<dt>Reisemittel:</dt><dd>${esc(transport)}</dd>` : ''}
    </dl>
    <p class="progress">${progress}</p>
    <div class="table-wrap">
      <table class="days">
        <thead><tr><th>Tag</th><th>Programm</th><th>🙂☹️😉</th>${trip.foodColumn ? '<th>🍽️</th>' : ''}<th>😴💤</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${visible.length ? '' : `<div class="empty-note">${term ? 'Keine Treffer.' : 'Noch keine Tage erfasst.'}</div>`}
    </div>

    <h2>Fazit</h2>
    <button type="button" class="fazit-box" id="fazit">${trip.fazit
      ? linesHtml(commentItems(trip.fazit))
      : '<span class="muted">✏️ Antippen, um das Fazit zu schreiben.</span>'}</button>

    <h2>Gesamtkosten</h2>
    <div class="kosten">
      <span>€</span>
      <input type="text" id="kosten" inputmode="numeric" placeholder="0" value="${trip.kosten == null ? '' : thousands(trip.kosten)}">
      <span>,-</span>
    </div>

    ${stays.length ? `
      <h2>Quartierliste</h2>
      <div class="table-wrap fit">
        <table class="days static">
          <thead><tr><th>Quartier</th><th>Zeitraum</th><th class="num">Nächte</th></tr></thead>
          <tbody>${stays.map((st, i) => `<tr class="${i % 2 ? 'alt' : ''}">
            <td>${quarterHtml(st.q, '', true)}</td>
            <td class="nw">${shortDate(st.firstNight)} - ${fullDate(addDays(st.lastNight, 1))}</td>
            <td class="num">${st.nights}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>` : ''}

    <h2>Statistik</h2>
    <dl class="meta">${tripStats(trip).map(([k, v]) => `<dt>${k}:</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;

  fab.hidden = false;
  const bar = app.querySelector('#bar');
  document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px');

  app.querySelector('#trips').onclick = openTripsDialog;
  app.querySelector('#output').onclick = () => openOutputDialog(trip);
  app.querySelector('#theme').onclick = cycleTheme;
  app.querySelector('#toggleEmpty').onclick = () => {
    db.settings.hideEmpty = !db.settings.hideEmpty;
    save();
    render();
  };
  const search = app.querySelector('#search');
  search.oninput = () => {
    searchTerm = search.value;
    render();
    const s = app.querySelector('#search');
    s.focus();
    s.selectionStart = s.selectionEnd = s.value.length;
  };
  app.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => openDayDialog(trip, tr.dataset.day));
  app.querySelector('#fazit').onclick = () => openFazitDialog(trip);
  app.querySelector('#kosten').oninput = e => {
    const digits = e.target.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 9);
    trip.kosten = digits ? Number(digits) : null;
    e.target.value = digits ? thousands(trip.kosten) : '';
    save();
  };

  if (scrollToGap) {
    const row = app.querySelector('tr.gap');
    if (row) row.scrollIntoView({ block: 'center' });
  }
}

// Eigene Fenster statt alert/confirm, damit die Schaltflächen deutsch beschriftet sind.
function messageBox(title, html, buttons) {
  return new Promise(resolve => {
    msg.innerHTML = `
      <form method="dialog">
        <div class="dlg-head"><h3>${esc(title)}</h3></div>
        <div class="dlg-body"><div class="msg-text">${html}</div></div>
        <div class="dlg-foot">
          ${buttons.map((b, i) => `${i === buttons.length - 1 ? '<span class="spacer"></span>' : ''}
            <button type="button" class="${b.cls || ''}" data-v="${b.value}">${esc(b.label)}</button>`).join('')}
        </div>
      </form>`;
    const done = value => { if (msg.open) msg.close(); resolve(value); };
    msg.querySelectorAll('[data-v]').forEach(b => b.onclick = () => done(b.dataset.v === 'yes'));
    msg.oncancel = e => { e.preventDefault(); done(false); };
    msg.showModal();
  });
}

const ask = (title, html, label, danger = false) =>
  messageBox(title, html, [{ label: '↩️ Abbrechen', value: 'no' }, { label, value: 'yes', cls: danger ? 'danger' : 'primary' }]);
const inform = (title, html) => messageBox(title, html, [{ label: '✖️ Schließen', value: 'no' }]);

/* ---------- Dialoge ---------- */

// Der Dialog bleibt offen und bekommt nur neuen Inhalt; so kommt kein verspätetes Schließ-Ereignis an.
function openDialog(html) {
  clearInterval(autosaveTimer);
  dlg.onclose = null;
  dlg.innerHTML = html;
  dlg.returnValue = '';
  if (!dlg.open) dlg.showModal();
  dlg.querySelector('.dlg-body')?.scrollTo(0, 0);
  dlg.querySelectorAll('[data-act=cancel]').forEach(b => b.onclick = () => dlg.close('cancel'));
}

const MOOD_HINT = 'Lange drücken entfernt einen Smiley aus der Leiste. ↺ stellt die Standard-Smileys wieder her. Weitere Smileys über die Emoji-Taste der Tastatur.';
const micButton = id => SpeechRec ? `<button type="button" class="mic" data-mic="${id}" aria-pressed="false" aria-label="Diktieren">🎤</button>` : '';
const micHint = () => SpeechRec ? '' : '<div class="hint" style="margin-top:12px">🎤 Zum Diktieren die Mikrofon-Taste auf der Tastatur verwenden.</div>';
const autosaveFoot = `
      <div class="dlg-foot">
        <button type="button" data-act="cancel">↩️ Abbrechen</button>
        <span class="saved" id="savedInfo"></span>
        <span class="spacer"></span>
        <button class="primary" value="ok">✅ Fertig</button>
      </div>`;

// Smiley-Schnellauswahl: Antippen fügt ein, lange drücken entfernt, ↺ setzt zurück.
function mountMoodRow(row, ta, onReset, kind = 'mood') {
  const set = EMOJI_SETS[kind];
  const draw = () => {
    row.innerHTML = quickMoods(kind).map(m => `<button type="button" data-m="${m}">${m}</button>`).join('')
      + '<button type="button" class="reset" aria-label="Standard-Smileys wiederherstellen">↺</button>';
    row.querySelectorAll('[data-m]').forEach(b => onLongPress(b,
      async () => {
        if (!await ask('Smiley entfernen', `${b.dataset.m} aus der Schnellauswahl entfernen?`, 'Entfernen')) return;
        db[set.hidden].push(b.dataset.m);
        delete db[set.usage][b.dataset.m];
        save();
        draw();
      },
      () => insertEmoji(ta, b.dataset.m)));
    row.querySelector('.reset').onclick = async () => {
      if (!await ask('Smileys zurücksetzen', 'Standard-Smileys wiederherstellen und alle Zähler auf null setzen?', 'Zurücksetzen')) return;
      db[set.usage] = {};
      db[set.hidden] = [];
      onReset();
      save();
      draw();
    };
  };
  draw();
}

// Diktieren über die Web Speech API; liefert eine Funktion zum Stoppen.
function mountMics() {
  let recognition = null;
  dlg.querySelectorAll('[data-mic]').forEach(b => b.onclick = () => {
    if (recognition) { recognition.stop(); return; }
    const ta = dlg.querySelector('#' + b.dataset.mic);
    recognition = new SpeechRec();
    recognition.lang = 'de-DE';
    recognition.interimResults = false;
    recognition.onresult = ev => {
      const text = Array.from(ev.results, r => r[0].transcript).join(' ').trim();
      if (text) insertAtCursor(ta, text + ' ', false);
    };
    recognition.onerror = ev => {
      if (ev.error === 'not-allowed') inform('Diktieren', 'Bitte den Mikrofon-Zugriff erlauben oder die Mikrofon-Taste der Tastatur verwenden.');
    };
    recognition.onend = () => { b.setAttribute('aria-pressed', 'false'); recognition = null; };
    b.setAttribute('aria-pressed', 'true');
    recognition.start();
  });
  return () => recognition?.stop();
}

// Reise anlegen oder bearbeiten; überschneidende Zeiträume werden verhindert.
function openTripDialog(trip) {
  const isNew = !trip;
  const t = trip || { title: '', participants: '', start: todayISO(), end: addDays(todayISO(), 14), transport: [], quarterList: false, foodColumn: false };
  const transport = new Set(t.transport);
  openDialog(`
    <form method="dialog">
      <div class="dlg-head"><h3>${isNew ? 'Neues Reiselogbuch' : 'Reiselogbuch bearbeiten'}</h3></div>
      <div class="dlg-body">
        <div class="step"><label for="fTitle">Reisetitel</label>
          <input type="text" id="fTitle" value="${esc(t.title)}" placeholder="z. B. Australien"></div>
        <div class="step"><label for="fPeople">Reiseteilnehmer</label>
          <input type="text" id="fPeople" value="${esc(t.participants)}" placeholder="z. B. Gerhild & Arnold"></div>
        <div class="step"><label>Reisezeitraum</label>
          <div style="display:flex;gap:10px">
            <input type="date" id="fStart" value="${t.start}" aria-label="Von">
            <input type="date" id="fEnd" value="${t.end}" aria-label="Bis">
          </div>
          <div class="warn" id="tripWarn"></div>
        </div>
        <div class="step"><label>Reisemittel</label>
          <div class="chips" id="transport">
            ${TRANSPORT.map(x => `<button type="button" data-t="${x.id}" aria-pressed="${transport.has(x.id)}">${x.icon} ${x.name}</button>`).join('')}
          </div>
        </div>
        <div class="step">
          <label class="check"><input type="checkbox" id="fQuarterList" ${t.quarterList ? 'checked' : ''}> Quartierliste in der Ausgabe</label>
          <div class="hint">Am Ende der Ausgabe: alle Quartiere mit Zeitraum, Anzahl Nächte und Maps-Link.</div>
        </div>
        <div class="step">
          <label class="check"><input type="checkbox" id="fFood" ${t.foodColumn ? 'checked' : ''}> 🍽️ Spalte Essen (Restaurants)</label>
          <div class="hint">Zusätzliche Spalte vor dem Quartier für Lokale und Essen, mit Maps-Link.</div>
        </div>
        ${isNew ? '' : `<div style="margin-top:24px">
          <button type="button" class="danger" id="deleteTrip">🗑 Reiselogbuch löschen</button>
        </div>`}
      </div>
      <div class="dlg-foot">
        <button type="button" data-act="cancel">↩️ Abbrechen</button>
        <span class="spacer"></span>
        <button class="primary" value="ok" id="okTrip">✅ Fertig</button>
      </div>
    </form>`);

  const fTitle = dlg.querySelector('#fTitle');
  const fStart = dlg.querySelector('#fStart');
  const fEnd = dlg.querySelector('#fEnd');
  const warn = dlg.querySelector('#tripWarn');
  const ok = dlg.querySelector('#okTrip');

  dlg.querySelectorAll('#transport button').forEach(b => b.onclick = () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    on ? transport.add(b.dataset.t) : transport.delete(b.dataset.t);
  });

  const validate = () => {
    const start = fStart.value, end = fEnd.value;
    let text = '';
    if (!fTitle.value.trim()) text = 'Bitte einen Reisetitel eingeben.';
    else if (!start || !end) text = 'Bitte Beginn und Ende der Reise wählen.';
    else {
      const other = overlappingTrip(start, end, trip?.id);
      if (other) text = `Der Zeitraum überschneidet sich mit „${other.title}“ (${fullDate(other.start)} - ${fullDate(other.end)}). Bitte korrigieren.`;
    }
    warn.textContent = text;
    ok.disabled = Boolean(text);
    return !text;
  };
  // Von und Bis gleichen sich an, damit das Ende nie vor dem Beginn liegt.
  fStart.oninput = () => { if (fStart.value && fEnd.value < fStart.value) fEnd.value = fStart.value; validate(); };
  fEnd.oninput = () => { if (fEnd.value && fStart.value > fEnd.value) fStart.value = fEnd.value; validate(); };
  fTitle.oninput = validate;
  validate();

  const del = dlg.querySelector('#deleteTrip');
  if (del) del.onclick = async () => {
    const yes = await ask('Reiselogbuch löschen',
      `„${esc(trip.title)}“ mit allen Einträgen wirklich löschen?<div class="hint">Tipp: Vorher ein Backup sichern. Das Löschen kann nicht rückgängig gemacht werden.</div>`,
      'Löschen', true);
    if (!yes) return;
    db.trips = db.trips.filter(x => x.id !== trip.id);
    save();
    dlg.close();
    showTrip(currentTripId === trip.id ? pickStartTrip()?.id : currentTripId);
  };

  dlg.onclose = () => {
    if (dlg.returnValue !== 'ok' || !validate()) return;
    const target = trip || { id: uid(), days: {}, fazit: '', kosten: null, outputCounter: 0 };
    target.title = fTitle.value.trim();
    target.participants = dlg.querySelector('#fPeople').value.trim();
    target.start = fStart.value;
    target.end = fEnd.value;
    target.transport = TRANSPORT.map(x => x.id).filter(id => transport.has(id));
    target.quarterList = dlg.querySelector('#fQuarterList').checked;
    target.foodColumn = dlg.querySelector('#fFood').checked;
    if (isNew) db.trips.push(target);
    save();
    if (isNew) showTrip(target.id); else render();
  };
}

// Einen Tag in 4 Schritten erfassen; speichert automatisch alle 10 Sekunden.
function openDayDialog(trip, iso) {
  const days = tripDays(trip);
  const idx = days.indexOf(iso);
  const isFirst = idx <= 0;
  const original = trip.days[iso] ? { ...trip.days[iso] } : null;
  const e = original || {};
  const weather = new Set(graphemes(e.weather));
  const knownQuarters = [...new Set(days.map(d => quarterOf(trip, d).name).filter(Boolean))];
  const prev = isFirst ? { name: '', place: '' } : quarterOf(trip, days[idx - 1]);
  const same = Boolean(e.sameQuarter) && !isFirst;

  openDialog(`
    <form method="dialog">
      <div class="dlg-head">
        <button type="button" data-nav="-1" ${isFirst ? 'disabled' : ''}>‹ Vortag</button>
        <h3>${longDayLabel(iso)}</h3>
        <button type="button" data-nav="1" ${idx >= days.length - 1 ? 'disabled' : ''}>Folgetag ›</button>
      </div>
      <div class="dlg-body">
        <div class="step">
          <div class="step-head"><label><span class="step-num">1</span>Wetter</label></div>
          <div class="emoji-row" id="wx">
            ${WEATHER.map(w => `<button type="button" aria-pressed="${weather.has(w)}" data-w="${w}">${w}</button>`).join('')}
          </div>
        </div>
        <div class="step">
          <div class="step-head"><label for="fProgram"><span class="step-num">2</span>Programm</label>${micButton('fProgram')}</div>
          <div class="chips" id="suggest">
            ${PROGRAM_SUGGESTIONS.map((s, i) => `<button type="button" data-s="${i}">${esc(s.label)}</button>`).join('')}
          </div>
          <textarea id="fProgram" placeholder="Was habt ihr gemacht? Eine Zeile pro Punkt.">${esc(e.program || '')}</textarea>
        </div>
        <div class="step">
          <div class="step-head"><label for="fComment"><span class="step-num">3</span>Wie war's?</label>${micButton('fComment')}</div>
          <div class="emoji-row" id="moods"></div>
          <textarea id="fComment" placeholder="Smiley antippen, dann ein paar Worte dazu.">${esc(e.comment || '')}</textarea>
          <div class="hint">${MOOD_HINT}</div>
        </div>
        ${trip.foodColumn ? `<div class="step">
          <div class="step-head"><label for="fFoodText"><span class="step-num">4</span>Essen</label>${micButton('fFoodText')}</div>
          <div class="emoji-row" id="foodMoods"></div>
          <textarea id="fFoodText" placeholder="Eine Zeile pro Lokal: Smileys, Name – Kommentar">${esc(e.food || '')}</textarea>
          <div class="hint">Format: „🕛😋 Hard Rock Café – Steak war super“. Der Name wird zum Maps-Link (mit dem Ort des Quartiers).</div>
        </div>` : ''}
        <div class="step">
          <div class="step-head"><label for="fQuarter"><span class="step-num">${trip.foodColumn ? 5 : 4}</span>Quartier</label></div>
          ${isFirst ? '' : `<label class="check"><input type="checkbox" id="fSame" ${same ? 'checked' : ''}> Quartier wie Vortag</label>`}
          <input type="text" id="fQuarter" list="quarterList" placeholder="z. B. Oaks Townsville Hotel">
          <datalist id="quarterList">${knownQuarters.map(q => `<option value="${esc(q)}">`).join('')}</datalist>
          <input type="text" id="fPlace" placeholder="Ort für Google Maps (optional, z. B. Cairns, Australien)" style="margin-top:8px">
          <div class="hint" id="qHint"></div>
        </div>
        ${micHint()}
      </div>
      ${autosaveFoot}
    </form>`);

  const fProgram = dlg.querySelector('#fProgram');
  const fComment = dlg.querySelector('#fComment');
  const fQuarter = dlg.querySelector('#fQuarter');
  const fPlace = dlg.querySelector('#fPlace');
  const fSame = dlg.querySelector('#fSame');
  const qHint = dlg.querySelector('#qHint');
  const savedInfo = dlg.querySelector('#savedInfo');
  let own = { name: same ? '' : (e.quarter || ''), place: same ? '' : (e.place || '') };
  const fFood = dlg.querySelector('#fFoodText');
  let lastComment = e.comment || '';
  let lastFood = e.food || '';
  let lastSnapshot = JSON.stringify(original);

  // Schritt 1: Wetter
  dlg.querySelectorAll('#wx button').forEach(b => b.onclick = () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    on ? weather.add(b.dataset.w) : weather.delete(b.dataset.w);
  });

  // Schritt 2: Vorschläge als neue Zeile einfügen
  dlg.querySelectorAll('#suggest button').forEach(b => b.onclick = () => {
    insertAtCursor(fProgram, PROGRAM_SUGGESTIONS[b.dataset.s].text, true);
  });

  // Schritt 3: Smiley-Schnellauswahl
  mountMoodRow(dlg.querySelector('#moods'), fComment, () => { lastComment = fComment.value.trim(); });
  if (fFood) mountMoodRow(dlg.querySelector('#foodMoods'), fFood, () => { lastFood = fFood.value.trim(); }, 'food');

  // Schritt 4: Quartier
  const updateQuarter = () => {
    const useSame = Boolean(fSame?.checked);
    fQuarter.disabled = fPlace.disabled = useSame;
    const q = useSame ? prev : own;
    fQuarter.value = q.name;
    fPlace.value = q.place;
    if (useSame && !prev.name) qHint.textContent = 'Am Vortag ist noch kein Quartier eingetragen.';
    else qHint.innerHTML = q.name ? `<a href="${mapsUrl(q)}" target="_blank" rel="noopener">📍 In Google Maps prüfen</a>` : '';
  };
  fQuarter.oninput = () => { own.name = fQuarter.value; updateQuarter(); };
  fPlace.oninput = () => { own.place = fPlace.value; updateQuarter(); };
  if (fSame) fSame.onchange = updateQuarter;
  updateQuarter();

  const stopMic = mountMics();

  const collect = () => {
    const useSame = Boolean(fSame?.checked);
    const next = {
      weather: WEATHER.filter(w => weather.has(w)).join(''),
      program: fProgram.value.trim(),
      comment: fComment.value.trim(),
      sameQuarter: useSame,
      quarter: useSame ? '' : own.name.trim(),
      place: useSame ? '' : own.place.trim(),
      // Bei ausgeblendeter Essen-Spalte bleiben vorhandene Einträge erhalten.
      food: fFood ? fFood.value.trim() : (e.food || ''),
    };
    return (next.weather || next.program || next.comment || next.sameQuarter || next.quarter || next.place || next.food) ? next : null;
  };

  const persist = () => {
    const next = collect();
    const snapshot = JSON.stringify(next);
    if (snapshot === lastSnapshot) return;
    countMoods(lastComment, next?.comment || '');
    lastComment = next?.comment || '';
    countMoods(lastFood, next?.food || '', 'food');
    lastFood = next?.food || '';
    if (next) trip.days[iso] = next; else delete trip.days[iso];
    if (save()) {
      lastSnapshot = snapshot;
      savedInfo.textContent = `Gespeichert ${nowStamp().time}`;
    }
  };

  const restore = () => {
    countMoods(lastComment, original?.comment || '');
    countMoods(lastFood, original?.food || '', 'food');
    if (original) trip.days[iso] = original; else delete trip.days[iso];
    save();
  };

  autosaveTimer = setInterval(persist, AUTOSAVE_MS);

  dlg.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {
    stopMic();
    persist();
    render();
    openDayDialog(trip, days[idx + Number(b.dataset.nav)]);
  });
  dlg.onclose = () => {
    clearInterval(autosaveTimer);
    stopMic();
    if (dlg.returnValue === 'ok') persist(); else restore();
    render();
  };
}

// Fazit wie "Wie war's?": Smiley-Leiste, Diktieren, automatisches Speichern.
function openFazitDialog(trip) {
  const original = trip.fazit || '';
  openDialog(`
    <form method="dialog">

      <div class="dlg-body">
        <div class="step">

        ${micHint()}

      ${autosaveFoot}

    render();
  };

function tripStats(trip) {
  const days = tripDays(trip);
  const rec = days.filter(d => isRecorded(trip, d));
  const quarters = new Set(rec.map(d => quarterOf(trip, d).name).filter(Boolean));
  // Varianten mit/ohne Emoji-Darstellungszeichen (z. B. ☹️ und ☹) zählen gemeinsam.
  const count = (list) => {
    const c = new Map();
    list.forEach(x => {
      const key = x.replace(/\uFE0F/g, '');
      const hit = c.get(key) || { shown: x, n: 0 };
      if (x.includes('\uFE0F')) hit.shown = x;
      hit.n++;
      c.set(key, hit);
    });
    return [...c.values()].sort((a, b) => b.n - a.n).map(h => [h.shown, h.n]);
  };
  const weather = count(rec.flatMap(d => graphemes(rawEntry(trip, d).weather)));
  const moods = count([...rec.map(d => rawEntry(trip, d).comment), trip.fazit].flatMap(emojisIn));
  const fmt = list => list.map(([e, n]) => `${n}×${e}`).join(' · ') || '–';
  return [
    ['Reisetage', `${days.length}, davon erfasst ${rec.length}`],
    ['Quartiere', String(quarters.size)],
    ['Wetter', fmt(weather)],
    ['Smileys', fmt(moods)],
  ];
}

// Aufeinanderfolgende Nächte im selben Quartier werden zu einem Aufenthalt zusammengefasst.
function quarterStays(trip) {
  const stays = [];
  for (const d of tripDays(trip)) {
    const q = quarterOf(trip, d);
    if (!q.name) continue;
    const last = stays[stays.length - 1];
    if (last && last.q.name === q.name && last.lastNight === addDays(d, -1)) {
      last.lastNight = d;
      last.nights++;
    } else {
      stays.push({ q, firstNight: d, lastNight: d, nights: 1 });
    }
  }
  return stays;
}

// Inhalt der Ausgabe: nur erfasste Tage, ohne Wetter-Platzhalter.
function outputBody(trip, version, stamp) {
  const rows = tripDays(trip).filter(iso => isRecorded(trip, iso)).map(iso => {
    const e = rawEntry(trip, iso);
    const q = quarterOf(trip, iso);
    return `<tr>
      <td class="nw">${dayLabel(iso)} ${esc(e.weather || '')}</td>
      <td>${linesHtml(programItems(e.program))}</td>
      <td>${linesHtml(commentItems(e.comment))}</td>
      ${trip.foodColumn ? `<td>${foodHtml(foodItems(e.food, q.place))}</td>` : ''}
      <td>${quarterHtml(q)}</td>
    </tr>`;
  }).join('');
  const transport = transportText(trip);
  const stays = trip.quarterList ? quarterStays(trip) : [];
  return `<div class="rt">
    <h1>Reiselogbuch – ${esc(trip.title)}</h1>
    <table class="meta">
      <tr><td><b>Reiseteilnehmer:</b></td><td>${esc(trip.participants)}</td></tr>
      <tr><td><b>Reisezeitraum:</b></td><td>${fullDate(trip.start)} - ${fullDate(trip.end)}</td></tr>
      ${transport ? `<tr><td><b>Reisemittel:</b></td><td>${esc(transport)}</td></tr>` : ''}
    </table>
    <table class="grid">
      <thead><tr><th>Tag</th><th>Programm</th><th>🙂☹️😉</th>${trip.foodColumn ? '<th>🍽️</th>' : ''}<th>😴💤</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="${trip.foodColumn ? 5 : 4}">Noch keine Tage erfasst.</td></tr>`}</tbody>
    </table>
    <h2>Fazit</h2>
    <div>${linesHtml(commentItems(trip.fazit))}</div>
    <h2>Gesamtkosten</h2>
    <p>${formatEuro(trip.kosten)}</p>
    ${stays.length ? `
      <h2>Quartierliste</h2>
      <table class="grid fit">
        <thead><tr><th>Quartier</th><th>Zeitraum</th><th class="num">Nächte</th></tr></thead>
        <tbody>${stays.map(s => `<tr>
          <td>${quarterHtml(s.q)}</td>
          <td class="nw">${shortDate(s.firstNight)} - ${fullDate(addDays(s.lastNight, 1))}</td>
          <td class="num">${s.nights}</td>
        </tr>`).join('')}</tbody>
      </table>` : ''}
    <h2>Statistik</h2>
    <table class="stats">
      ${tripStats(trip).map(([k, v]) => `<tr><td><b>${k}:</b></td><td>${esc(v)}</td></tr>`).join('')}
    </table>
    <p class="created">Ausgabe V${pad(version, 3)} erstellt am ${stamp.date} um ${stamp.time}</p>
  </div>`;
}

/* ---------- Speichern über das Teilen-Menü ---------- */

const DAY_MS = 24 * 60 * 60 * 1000;

function outputDocument(trip, version, stamp) {
  return `<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(outputName(trip, version))}</title>
<style>${OUTPUT_CSS}</style></head>
<body>${outputBody(trip, version, stamp)}</body></html>`;
}

function backupFile() {
  return { name: `Ω Backup Reiselogbuch ${nowStamp().file}.json`, type: 'json', content: JSON.stringify(db, null, 2) };
}

function backupIsOld() {
  const last = db.settings.lastBackup;
  return !last || Date.now() - last > DAY_MS;
}

function openOutputDialog(trip) {
  const count = tripDays(trip).filter(iso => isRecorded(trip, iso)).length;
  const nextVersion = (trip.outputCounter || 0) + 1;
  openDialog(`
    <form method="dialog">
      <div class="dlg-head"><h3>Ausgabe</h3></div>
      <div class="dlg-body">
        <p class="muted">${count} erfasste${count === 1 ? 'r Tag' : ' Tage'} · Stand jetzt</p>
        <button type="button" class="choice" id="outHtml">
          <strong>🌐 HTML-Datei</strong>
          <span class="muted">Teilen-Menü → „In Dateien sichern“</span>
        </button>
        <button type="button" class="choice" id="outPdf">
          <strong>📄 PDF</strong>
          <span class="muted">Drucken-Menü → Teilen → „In Dateien sichern“</span>
        </button>
        <div class="hint" style="margin-top:14px">Dateiname: ${esc(outputName(trip, nextVersion))}</div>
      </div>
      <div class="dlg-foot">
        <button type="button" data-act="cancel">↩️ Abbrechen</button>
        <span class="spacer"></span>
      </div>
    </form>`);
  dlg.querySelector('#outHtml').onclick = () => exportHtml(trip);
  dlg.querySelector('#outPdf').onclick = () => exportPdf(trip);
}

function nextOutput(trip) {
  trip.outputCounter = (trip.outputCounter || 0) + 1;
  save();
  return { version: trip.outputCounter, stamp: nowStamp() };
}

// Muss direkt aus dem Antippen heraus aufgerufen werden, sonst blockiert Safari das Teilen-Menü.
async function exportHtml(trip) {
  const { version, stamp } = nextOutput(trip);
  const file = { name: `${outputName(trip, version)}.html`, type: 'html', content: outputDocument(trip, version, stamp) };
  dlg.close();
  const result = await shareFiles([file]);
  showOutputResult(`Ausgabe V${pad(version, 3)}`, file.name, result);
}

// PDF über das Drucken-Menü; der Seitentitel wird als Dateiname vorgeschlagen.
function exportPdf(trip) {
  const { version, stamp } = nextOutput(trip);
  const name = outputName(trip, version);
  showOutputResult(`Ausgabe V${pad(version, 3)}`, name + '.pdf', 'print');
  const oldTitle = document.title;
  printout.innerHTML = `<style>${OUTPUT_CSS.replace(/\bbody\b/g, '#printout')}</style>${outputBody(trip, version, stamp)}`;
  document.title = name;
  const restore = () => { document.title = oldTitle; window.removeEventListener('afterprint', restore); };
  dlg.addEventListener('close', () => { printout.innerHTML = ''; }, { once: true });
  window.addEventListener('afterprint', restore);
  dlg.addEventListener('close', restore, { once: true });
  setTimeout(() => window.print(), 50);
}

const RESULT_TEXT = {
  shared: name => `Teilen-Menü abgeschlossen für <b>${esc(name)}</b>.<div class="hint">Wenn du „In Dateien sichern“ gewählt hast, liegt die Datei im gewählten Ordner.</div>`,
  downloaded: name => `Download von <b>${esc(name)}</b> angestoßen.<div class="hint">Bitte in der Dateien-App unter „Downloads“ prüfen.</div>`,
  aborted: name => `Teilen-Menü abgebrochen – <b>${esc(name)}</b> wurde nicht gespeichert.`,
  error: name => `<b>${esc(name)}</b> konnte nicht übergeben werden.`,
  print: name => `Drucken-Menü geöffnet für <b>${esc(name)}</b>.<div class="hint">Dort über „Teilen“ → „In Dateien sichern“ als PDF ablegen.</div>`,
};

function showOutputResult(title, name, result) {
  const remind = backupIsOld() && result !== 'aborted' && result !== 'error';
  openDialog(`
    <form method="dialog">
      <div class="dlg-head"><h3>${esc(title)}</h3></div>
      <div class="dlg-body">
        <div class="step">${result === 'aborted' || result === 'error' ? '⚠️' : '✅'} ${RESULT_TEXT[result](name)}</div>
        ${remind ? backupReminderHtml() : ''}
      </div>
      <div class="dlg-foot">
        <span class="spacer"></span>
        <button type="button" data-act="cancel">✖️ Schließen</button>
      </div>
    </form>`);
  bindBackupReminder();
}

function backupReminderHtml() {
  const last = db.settings.lastBackup;
  const since = last ? `Letztes Backup vor ${Math.floor((Date.now() - last) / DAY_MS)} Tag(en).` : 'Noch kein Backup gesichert.';
  return `<div class="step" id="reminder">
      <strong>💾 Denk daran, auch ein Backup zu sichern.</strong>
      <div class="hint">${since}</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button type="button" class="primary" id="backupNow">💾 Backup sichern</button>
      </div>
    </div>`;
}

function bindBackupReminder() {
  const btn = dlg.querySelector('#backupNow');
  if (!btn) return;
  btn.onclick = async () => {
    const name = await saveBackup();
    const box = dlg.querySelector('#reminder');
    if (box && name) box.innerHTML = name;
  };
}

// Sichert das Backup über das Teilen-Menü; der Zeitpunkt zählt nur, wenn das Menü abgeschlossen wurde.
async function saveBackup() {
  const file = backupFile();
  const result = await shareFiles([file]);
  if (result === 'shared' || result === 'downloaded') {
    db.settings.lastBackup = Date.now();
    save();
  }
  const text = `${result === 'aborted' || result === 'error' ? '⚠️' : '✅'} ${RESULT_TEXT[result](file.name)}`;
  if (!dlg.querySelector('#reminder')) inform('Backup', text);
  return text;
}

const MIME = { json: 'application/json', html: 'text/html' };

async function shareFiles(files) {
  const list = files.map(f => new File([f.content], f.name, { type: MIME[f.type] || 'application/octet-stream' }));
  if (navigator.canShare && navigator.canShare({ files: list })) {
    try {
      await navigator.share({ files: list });
      return 'shared';
    } catch (e) {
      return e.name === 'AbortError' ? 'aborted' : 'error';
    }
  }
  files.forEach(f => downloadFile(f.name, f.content, MIME[f.type]));
  return 'downloaded';
}

function downloadFile(name, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ---------- Backup ---------- */

importFile.onchange = async () => {
  const file = importFile.files[0];
  importFile.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.trips)) throw new Error('Kein Reiselogbuch-Backup.');
    const yes = await ask('Backup laden',
      `Backup mit ${data.trips.length} Reise(n) laden?<div class="hint">Die aktuellen Daten auf diesem iPad werden ersetzt.</div>`, 'Ersetzen', true);
    if (!yes) return;
    db = normalize(data);
    save();
    applyTheme();
    if (dlg.open) dlg.close();
    showTrip(pickStartTrip()?.id);
  } catch (e) {
    inform('Backup laden', 'Die Datei konnte nicht gelesen werden: ' + esc(e.message));
  }
};

/* ---------- Start ---------- */

applyTheme();
showTrip(pickStartTrip()?.id);
window.addEventListener('resize', () => {
  const bar = document.getElementById('bar');
  if (bar) document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px');
});

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
